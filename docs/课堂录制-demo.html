<title>菁仕课堂原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout：模拟桌面（菜单栏 / 任务栏 + 居中 App 窗口 + 右侧演示场景栏）；App 内为侧栏（今天 / 报告 / 账号设置）+ 内容区 */
:root {
  --desk: #e4e8e5; --menubar: rgba(247,248,246,.86);
  --bg: #fbfbfa; --side: #f3f4f2; --surface: #ffffff; --hover: #ebedea; --active: #e3e6e2;
  --line: #e4e6e2; --line-2: #d3d7d1;
  --text: #181b19; --text-2: #575e59; --text-3: #8a908b;
  --ink: #1a1e1b; --ink-fg: #ffffff;
  --brand: #1e7a54; --brand-soft: #e2f1e8;
  --rec: #dc4238; --rec-soft: #fcebe9;
  --warn: #95600f; --warn-soft: #faf0db;
  --ok: #22804e; --ok-soft: #e3f2e9;
  --overlay: rgba(16,20,18,.32);
  --shadow-win: 0 0 0 .5px rgba(0,0,0,.14), 0 28px 70px -16px rgba(18,28,22,.32), 0 10px 22px -10px rgba(18,28,22,.2);
  --shadow-pop: 0 0 0 .5px rgba(0,0,0,.1), 0 14px 36px -8px rgba(18,28,22,.26);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b0d0c; --menubar: rgba(30,33,31,.84);
    --bg: #161917; --side: #121413; --surface: #1c1f1d; --hover: #232724; --active: #2a2f2b;
    --line: #272b28; --line-2: #343a36;
    --text: #e8ebe8; --text-2: #a1a8a3; --text-3: #6f7772;
    --ink: #e8ebe8; --ink-fg: #121413;
    --brand: #4fc48d; --brand-soft: #15301f;
    --rec: #ff5d54; --rec-soft: #3a1a18;
    --warn: #e3a84c; --warn-soft: #33270f;
    --ok: #4fc48d; --ok-soft: #14301f;
    --overlay: rgba(0,0,0,.55);
    --shadow-win: 0 0 0 .5px rgba(255,255,255,.1), 0 28px 70px -16px rgba(0,0,0,.7);
    --shadow-pop: 0 0 0 .5px rgba(255,255,255,.1), 0 14px 36px -8px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b0d0c; --menubar: rgba(30,33,31,.84);
  --bg: #161917; --side: #121413; --surface: #1c1f1d; --hover: #232724; --active: #2a2f2b;
  --line: #272b28; --line-2: #343a36;
  --text: #e8ebe8; --text-2: #a1a8a3; --text-3: #6f7772;
  --ink: #e8ebe8; --ink-fg: #121413;
  --brand: #4fc48d; --brand-soft: #15301f;
  --rec: #ff5d54; --rec-soft: #3a1a18;
  --warn: #e3a84c; --warn-soft: #33270f;
  --ok: #4fc48d; --ok-soft: #14301f;
  --overlay: rgba(0,0,0,.55);
  --shadow-win: 0 0 0 .5px rgba(255,255,255,.1), 0 28px 70px -16px rgba(0,0,0,.7);
  --shadow-pop: 0 0 0 .5px rgba(255,255,255,.1), 0 14px 36px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 14px; height: 14px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- 桌面 ---------- */
#desk { min-height: 100vh; display: flex; flex-direction: column; }
#menubar { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); background: var(--menubar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: relative; z-index: 30; border-bottom: .5px solid var(--line); }
#menubar b { font-weight: 650; }
.mb-right { display: flex; gap: 14px; align-items: center; }
.tray { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 7px; border-radius: 5px; }
.tray:hover, .tray.open { background: var(--hover); }
.tray .glyph { width: 15px; height: 15px; border-radius: 50%; border: 1.6px solid currentColor; display: grid; place-items: center; }
.tray .glyph::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.tray.rec .glyph { color: var(--rec); }
.tray .tlabel { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--rec); }
#stageWrap { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) auto; }
#stage { display: flex; justify-content: center; align-items: flex-start; padding-block: 28px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); min-width: 0; }
.desk-hint { margin-top: 18vh; text-align: center; color: var(--text-3); line-height: 1.8; }
.desk-hint b { color: var(--text-2); font-weight: 600; }
#taskbar { display: none; height: 44px; align-items: center; justify-content: space-between; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); background: var(--menubar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: .5px solid var(--line); position: relative; z-index: 30; }
.plat-win #taskbar { display: flex; }
.plat-win #menubar { display: none; }
.tb-app { width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; position: relative; }
.tb-app:hover { background: var(--hover); }
.tb-app.on::after { content: ""; position: absolute; bottom: 2px; width: 14px; height: 3px; border-radius: 2px; background: var(--brand); }
.tb-right { display: flex; align-items: center; gap: 12px; font-size: 12px; }
.tb-clock { text-align: right; line-height: 1.3; font-variant-numeric: tabular-nums; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
.logo.lg { width: 56px; height: 56px; border-radius: 14px; font-size: 28px; margin: 0 auto; }

/* ---------- 窗口 ---------- */
.win { position: relative; width: min(1080px, 100%); height: clamp(600px, calc(100vh - 92px), 760px); background: var(--bg); border-radius: 12px; box-shadow: var(--shadow-win); overflow: hidden; display: flex; flex-direction: column; }
.plat-win .win { border-radius: 8px; height: clamp(600px, calc(100vh - 108px), 760px); }
.win-title { display: none; height: 32px; align-items: center; justify-content: space-between; padding-left: 12px; border-bottom: 1px solid var(--line); background: var(--side); flex: none; }
.plat-win .win-title { display: flex; }
.wt-left { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-2); }
.wt-left .logo { width: 16px; height: 16px; border-radius: 4px; font-size: 9px; }
.wctl { display: flex; height: 100%; }
.wctl button { width: 46px; height: 100%; display: grid; place-items: center; color: var(--text-2); }
.wctl button:hover { background: var(--hover); }
.wctl button.close:hover { background: #c42b1c; color: #fff; }
.win-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 208px minmax(0,1fr); }
.win-body.solo { grid-template-columns: 1fr; }
.lights { display: flex; gap: 8px; height: 40px; align-items: center; padding-left: 8px; }
.plat-win .lights { display: none; }
.lights button { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
.l-close { background: #ff5f57; } .l-min { background: #febc2e; } .l-max { background: #28c840; }

/* 侧栏 */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 0 10px 10px; min-height: 0; }
.plat-win .side { padding-top: 10px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 14px; font-weight: 650; font-size: 14px; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 9px; border-radius: 7px; color: var(--text-2); text-align: left; width: 100%; }
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item.on { background: var(--active); color: var(--text); font-weight: 560; }
.nav-item .grow { flex: 1; }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: var(--ink-fg); font-size: 11px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rec); animation: pulse 1.6s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .35; } }
.side-spacer { flex: 1; }
.rec-mini { display: block; width: 100%; text-align: left; border-radius: 9px; padding: 10px 11px; background: var(--rec-soft); margin-bottom: 10px; }
.rm-top { display: flex; align-items: center; gap: 7px; color: var(--rec); font-weight: 600; font-variant-numeric: tabular-nums; }
.rm-sub { color: var(--text-2); font-size: 12px; margin-top: 2px; }
.me { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 8px; width: 100%; text-align: left; }
.me:hover { background: var(--hover); }
.me.on { background: var(--active); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 650; font-size: 12px; display: grid; place-items: center; flex: none; }
.me .who { font-weight: 560; line-height: 1.25; }
.me .sub { font-size: 11.5px; color: var(--text-3); line-height: 1.3; }

/* 主区 */
.main { min-width: 0; min-height: 0; overflow: auto; position: relative; }
.page { padding: 28px 40px 48px; max-width: 840px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 680; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
.page-head .date { color: var(--text-3); font-size: 14px; margin-left: 10px; font-weight: 450; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 520; white-space: nowrap; color: var(--text); }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: var(--ink); opacity: .88; }
.btn.danger { background: var(--rec); color: #fff; border-color: transparent; }
.btn.danger:hover:not(:disabled) { background: var(--rec); opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.btn.lg { height: 36px; padding: 0 16px; font-size: 13.5px; border-radius: 8px; }
.btn.icon { width: 30px; padding: 0; }
.btn:disabled { opacity: .45; }
.btn.stop { color: var(--rec); }
.muted { color: var(--text-3); font-size: 12px; }

/* 状态词 */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.st .d { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex: none; }
.st.rec { color: var(--rec); } .st.rec .d { background: var(--rec); }
.st.ok { color: var(--ok); } .st.ok .d { background: var(--ok); }
.st.warn { color: var(--warn); } .st.warn .d { background: var(--warn); }
.st.todo { color: var(--text); font-weight: 560; } .st.todo .d { background: var(--ink); }
.st.faint { color: var(--text-3); }
.spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid var(--line-2); border-top-color: var(--text-2); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 今天：状态卡 */
.card { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 20px 22px; }
.card.rec { border-color: color-mix(in srgb, var(--rec) 30%, var(--line)); }
.card.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); background: color-mix(in srgb, var(--warn-soft) 50%, var(--surface)); }
.eyebrow { font-size: 12px; color: var(--text-3); font-weight: 560; display: flex; align-items: center; gap: 6px; }
.card-title { font-size: 20px; font-weight: 680; margin-top: 3px; letter-spacing: -.01em; }
.card-sub { color: var(--text-2); margin-top: 2px; }
.split { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.split > div { min-width: 0; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; text-align: right; }
.when { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.timer { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.05; margin-top: 6px; }
.lvl { width: 128px; height: 16px; display: block; }
.rec-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.save-line { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
.save-line.bad { color: var(--warn); }
.banner { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 9px; margin-bottom: 16px; flex-wrap: wrap; background: var(--warn-soft); color: var(--warn); }
.banner .bt { flex: 1; min-width: 200px; color: var(--text); }
.banner .bt b { font-weight: 620; }
select { height: 28px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); font: inherit; padding: 0 8px; max-width: 220px; }
.bar { height: 4px; border-radius: 2px; background: var(--hover); overflow: hidden; margin-top: 14px; }
.bar i { display: block; height: 100%; background: var(--ok); transition: width .4s; }

/* 区块 */
.sec { margin-top: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.sec-head h2 { font-size: 13px; font-weight: 640; margin: 0; }
.todo-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--side); margin-top: 8px; }
.todo-row.warn { background: var(--warn-soft); }
.todo-row .tt { flex: 1; min-width: 0; font-weight: 560; }
.todo-row.warn .ic { color: var(--warn); }
.sched { border-top: 1px solid var(--line); }
.lr { display: grid; grid-template-columns: 96px minmax(0,1fr) auto; gap: 14px; align-items: center; min-height: 52px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.lr .lt { font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 12.5px; }
.lr .ln b { font-weight: 580; }
.lr .ln span { color: var(--text-3); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr .la { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.lr .la .btn { height: 26px; padding: 0 10px; font-size: 12px; }
.lr.cancel .ln b, .lr.cancel .lt { color: var(--text-3); }
.lr.cur { background: linear-gradient(90deg, var(--rec-soft), transparent 70%); }
.empty { text-align: center; padding: 40px 20px; color: var(--text-2); }
.empty .em-t { font-size: 15px; font-weight: 620; color: var(--text); margin-bottom: 4px; }
.em-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--side); display: grid; place-items: center; margin: 0 auto 12px; color: var(--text-2); }

/* ---------- 报告 ---------- */
.rp { display: grid; grid-template-columns: 290px minmax(0,1fr); height: 100%; }
.rl { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.rl-head { padding: 24px 14px 10px; }
.rl-head h1 { font-size: 18px; margin: 0 0 12px 4px; font-weight: 680; }
.seg { display: flex; background: var(--side); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; height: 26px; border-radius: 6px; color: var(--text-2); font-size: 12px; font-weight: 540; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 0 0 .5px var(--line-2), 0 1px 2px rgba(0,0,0,.06); }
.seg .n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.rl-list { flex: 1; overflow: auto; padding: 4px 8px 16px; }
.rl-date { font-size: 11.5px; color: var(--text-3); font-weight: 600; padding: 12px 8px 4px; }
.rl-row { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; }
.rl-row:hover { background: var(--hover); }
.rl-row.on { background: var(--active); }
.rl-top { display: flex; justify-content: space-between; gap: 8px; }
.rl-top b { font-weight: 590; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rl-top span { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.rl-row .st { margin-top: 3px; }
.rd { overflow: auto; min-width: 0; }
.rd-in { padding: 26px 34px 48px; max-width: 720px; }
.rd-title { font-size: 20px; font-weight: 680; letter-spacing: -.01em; }
.rd-sub { color: var(--text-2); margin-top: 2px; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 9px; margin-top: 16px; font-size: 12.5px; background: var(--side); color: var(--text-2); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice .ic { margin-top: 1px; }
.notice span { color: var(--text); }
.label { font-size: 12px; font-weight: 620; color: var(--text-2); }
.sum { margin-top: 22px; }
.sum-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.sum-text { display: block; width: 100%; min-height: 240px; field-sizing: content; resize: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 16px 18px; font: 14px/1.85 var(--font); }
.sum-text:hover { border-color: var(--line-2); }
.sum-text:focus { outline: none; border-color: var(--text-3); box-shadow: 0 0 0 3px var(--hover); }
.sum-foot { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
.more-acts { display: flex; gap: 8px; align-items: center; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; position: relative; }
.pick { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.pick label { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; background: var(--surface); }
.pick label:hover { border-color: var(--line-2); }
.pick label.on { border-color: var(--text-2); box-shadow: 0 0 0 1px var(--text-2); }
.pick input { margin-top: 3px; accent-color: var(--ink); }
.pick .pd { display: block; font-size: 12px; color: var(--text-3); }
.tag { color: var(--ok); font-size: 11.5px; font-weight: 600; margin-left: 6px; }
.quote { margin-top: 16px; padding: 12px 14px; border-radius: 9px; background: var(--side); color: var(--text-2); line-height: 1.7; }

/* 菜单 */
.menu { position: absolute; z-index: 40; min-width: 200px; background: var(--surface); border-radius: 9px; box-shadow: var(--shadow-pop); padding: 5px; }
.menu button, .menu .mi { display: flex; width: 100%; align-items: center; gap: 9px; min-height: 30px; padding: 0 9px; border-radius: 6px; text-align: left; white-space: nowrap; }
.menu button:hover:not(:disabled) { background: var(--hover); }
.menu button:disabled { color: var(--text-3); }
.menu button.danger { color: var(--rec); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.menu .mi { padding: 7px 9px; flex-direction: column; align-items: flex-start; gap: 1px; color: var(--text-2); font-size: 12px; }
.menu .mi b { color: var(--text); font-size: 13px; font-weight: 600; }
.more-acts .menu { right: 0; top: 56px; }

/* 设置 */
.group { margin-top: 22px; max-width: 600px; }
.group h3 { font-size: 12px; font-weight: 620; color: var(--text-3); margin: 0 0 6px 2px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.sr { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px; border-bottom: 1px solid var(--line); min-height: 50px; }
.sr:last-child { border-bottom: 0; }
.sr .sl { min-width: 0; }

/* ================= 录制逻辑 ================= */
function startRec(L, startedAt) {
  if (S.rec) return;
  S.rec = { lessonId: L ? L.id : null, startedAt, stopAt: L ? T(L.end) + 600 : null, up: Math.floor((S.now - startedAt) / 30), warned: false, silentWarn: S.silent };
  if (L) L.status = 'recording';
  dropNotifs('[data-act="startLesson"]');
  if (L) notify('rec', '已开始录制', `${L.course} · ${L.student}，${hm(S.rec.stopAt)} 自动结束`);
  if (S.silent) notify('alert', '没有检测到声音', '请确认麦克风没有被静音，或换一个麦克风。');
}
function stopRec() {
  const r = S.rec; if (!r) return;
  const endT = r.stopAt ? Math.min(S.now, r.stopAt) : S.now;
  const total = Math.floor((endT - r.startedAt) / 30) + 1;
  S.fin = { lessonId: r.lessonId, total, up: Math.min(r.up, total), startedAt: r.startedAt, endedAt: endT };
  const L = r.lessonId && lessonById(r.lessonId);
  if (L) L.status = 'uploading';
  S.rec = null;
  dropNotifs('[data-act="extend"]');
}
function finishFin() {
  const f = S.fin; S.fin = null;

function evaluate() {
  if (S.onboard) return false;
  const now = S.now; let changed = false;
  for (const L of visibleLessons()) {
    if (L.status !== 'upcoming') continue;
    const st = T(L.start), en = T(L.end);
    if (now >= st - 180 && S.prevNow < en + 600 && !S.rec) {
      if (S.appWasClosed) { L.status = 'missed'; changed = true; continue; }
      startRec(L, S.prevNow >= st - 180 ? now : st - 180);
      changed = true;
    }
  }
  if (S.rec && S.rec.lessonId) {
    const r = S.rec, L = lessonById(r.lessonId);
    if (now >= r.stopAt - 300 && !r.warned) {
      r.warned = true; changed = true;
      if (now < r.stopAt) notify('rec', '5 分钟后结束录制', `${L.course} · ${L.student} 已到下课时间，${hm(r.stopAt)} 自动结束。`, [{ label: '延长 15 分钟', act: 'extend' }, { label: '结束录制', act: 'askStop' }]);
    }
    if (now >= r.stopAt) { stopRec(); changed = true; }
  }
  for (const R of S.reports) {
    if (R.status === 'processing' && R.readyAt != null && now >= R.readyAt) {
      R.status = 'ready'; changed = true;
      const L = R.lessonId && lessonById(R.lessonId); if (L) L.status = 'done';
      notify('report', '课堂报告已生成', `${R.course} · ${R.student} 的家长总结可以检查和复制了。`, [{ label: '查看', act: 'openReport', arg: R.id }]);
    }
  }
  return changed;
}

function notify(kind, title, body, actions = []) {
  if (S.quiet) return;
  if (kind === 'report' && !S.settings.notifReport) return;
  if (kind === 'rec' && !S.settings.notifRec) return;   // kind === 'alert'：异常提醒不受开关影响
  const host = $('#notifs');
  const el = document.createElement('div');
  el.className = 'notif';
  el.innerHTML = `<div class="logo">菁</div><div><button class="notif-body" data-act="showWin" type="button"><div class="nt"><span>菁仕课堂</span><span>${hm(S.now)}</span></div><div class="nh">${esc(title)}</div><div class="nb">${esc(body)}</div></button>${actions.length ? `<div class="na">${actions.map((a, i) => `<button type="button" class="btn ${i === 0 ? 'primary' : ''}" data-act="${a.act}" data-arg="${esc(a.arg || '')}">${esc(a.label)}</button>`).join('')}</div>` : ''}</div>`;
  host.appendChild(el);
  while (host.children.length > 3) host.firstChild.remove();
  setTimeout(() => el.remove(), 8000);
}
function dropNotifs(sel) { document.querySelectorAll('.notif').forEach(n => { if (n.querySelector(sel)) n.remove(); }); }

function trayMenuHTML() {

/* ================= 渲染：App ================= */

  renderShell();
  const stage = $('#stage');
  if (S.winHidden) {
    stage.innerHTML = `<div class="desk-hint"><b>窗口已关闭，菁仕课堂仍在后台运行</b><br>录制和上传不受影响。点击${isMac() ? '菜单栏' : '任务栏'}里的图标可以重新打开。</div>`;
  } else {
    stage.innerHTML = `<div class="win" aria-label="菁仕课堂">
      <div class="win-title"><div class="wt-left"><span class="logo">菁</span>菁仕课堂</div><div class="wctl"><button type="button" data-act="hideWin" aria-label="最小化">${ic('min', 'sm')}</button><button type="button" aria-label="最大化">${ic('max', 'sm')}</button><button type="button" class="close" data-act="hideWin" aria-label="关闭">${ic('x', 'sm')}</button></div></div>
      <div class="win-body ${S.onboard ? 'solo' : ''}">${S.onboard ? onboardHTML() : sideHTML() + `<div class="main" data-scroll="main">${pageHTML()}</div>`}</div>
      ${modalHTML()}<div id="toastHost"></div></div>`;
  }
  renderBrowser();
  renderDemo();
  document.querySelectorAll('[data-scroll]').forEach(el => { if (scrollers[el.dataset.scroll] != null) el.scrollTop = scrollers[el.dataset.scroll]; });

}

    <div class="brand"><span class="logo">菁</span><span>菁仕课堂</span></div>
    <div class="nav">${nav('today', 'today', '今天', rec ? '<span class="live-dot" aria-label="录制中"></span>' : '')}${nav('reports', 'report', '报告', n ? `<span class="count" aria-label="${n} 项待处理">${n}</span>` : '')}</div>
    <div class="side-spacer"></div>
    ${rec && S.page !== 'today' ? `<button type="button" class="rec-mini" data-act="nav" data-arg="today"><div class="rm-top"><span class="live-dot"></span>录制中 <span data-live="elapsed">${hms(S.now - rec.startedAt)}</span></div><div class="rm-sub">${L ? `${esc(L.course)} · ${esc(L.student)}` : '临时录制'}</div></button>` : ''}
    <button type="button" class="me ${S.page === 'settings' ? 'on' : ''}" data-act="nav" data-arg="settings"><span class="avatar">${TEACHER[0]}</span><span class="who-wrap"><div class="who">${TEACHER}</div><div class="sub">设置</div></span></button>
  </nav>`;
}
function pageHTML() { return S.page === 'reports' ? reportsHTML() : S.page === 'settings' ? settingsHTML() : todayHTML(); }

/* ---------- 今天 ---------- */
function cardHTML() {
  const lessons = visibleLessons();
  if (S.rec) return recCardHTML();
  if (S.fin) return finCardHTML();
  const missed = lessons.find(l => l.status === 'missed' && S.now < T(l.end));
  if (missed) return `<div class="card warn"><div class="split"><div><div class="eyebrow" style="color:var(--warn)">${ic('alert', 'sm')} 这节课还没有录制</div><div class="card-title">${esc(missed.course)} · ${esc(missed.student)}</div><div class="card-sub">${missed.start} 已开始 · ${esc(missed.topic)}</div></div>

  const nx = nextLesson();
  if (nx) {
    const st = T(nx.start), canStart = S.now >= st - 1800;
    return `<div class="card"><div class="split">
      <div><div class="eyebrow">下一节 · ${nx.start}–${nx.end}</div><div class="card-title">${esc(nx.course)} · ${esc(nx.student)}</div><div class="card-sub">${esc(nx.topic)} · ${esc(nx.room)}</div>
        <div class="muted" style="margin-top:12px;display:flex;gap:6px;align-items:center">${S.net ? `${ic('mic', 'sm')} ${esc(micName(S.settings.mic))}` : `<span style="color:var(--warn);display:flex;gap:6px;align-items:center">${ic('wifiOff', 'sm')} 网络已断开，录音会先保存在本机</span>`}</div></div>
      <div class="right"><div><div class="when">${hm(st - 180)} 自动开始录制</div><div class="muted">开课前 3 分钟</div></div>
        <button type="button" class="btn primary lg" data-act="startLesson" data-arg="${nx.id}" ${canStart ? '' : 'disabled title="开课前 30 分钟内可以开始"'}>开始录制</button></div>
    </div></div>`;
  }
  if (!lessons.length) return `<div class="card"><div class="empty" style="padding:24px 10px"><div class="em-ic">${ic('today')}</div><div class="em-t">今天没有课</div><div>课表来自飞书。课表外的加课可以用「临时录制」。</div></div></div>`;
  return `<div class="card"><div class="eyebrow">今天的课都结束了</div><div class="card-title">明天见</div><div class="card-sub">明天的课表会自动同步。</div></div>`;
}
function saveLineHTML() {
  const r = S.rec, comp = Math.floor((S.now - r.startedAt) / 30);
  if (!S.net) return `<div class="save-line bad">${ic('wifiOff', 'sm')} 网络已断开。录音继续保存在本机，联网后自动上传</div>`;
  if (comp - r.up > 1) return `<div class="save-line"><span class="spin"></span> 网络已恢复，正在补传录音</div>`;
  return `<div class="save-line">${ic('check', 'sm')} 录音已保存，正在自动上传</div>`;
}
function recCardHTML() {
  const r = S.rec, L = r.lessonId && lessonById(r.lessonId);
  const ending = L && S.now >= r.stopAt - 300;
  return `<div class="card rec">
    ${r.silentWarn ? `<div class="banner">${ic('alert')}<div class="bt"><b>2 分钟没有检测到声音。</b>请确认麦克风没有被静音，或换一个。</div><select id="silentMic" data-change="mic" aria-label="切换麦克风">${MICS.map(m => `<option value="${m[0]}" ${m[0] === S.settings.mic ? 'selected' : ''}>${m[1]}</option>`).join('')}</select></div>` : ''}
    ${ending ? `<div class="banner">${ic('clock')}<div class="bt"><b>已到下课时间，</b>${hm(r.stopAt)} 自动结束录制。</div><button type="button" class="btn" data-act="extend">延长 15 分钟</button></div>` : ''}
    <div class="split">
      <div><div class="eyebrow" style="color:var(--rec)"><span class="live-dot"></span>录制中 · ${L ? `${esc(L.course)} · ${esc(L.student)}` : '临时录制'}</div><div class="timer" data-live="elapsed">${hms(S.now - r.startedAt)}</div></div>
      <div class="right"><div><div class="when">${L ? `${hm(r.stopAt)} 自动结束` : '需要手动结束'}</div><div class="muted">${L ? esc(L.topic) : '结束后选择对应的课程'}</div></div>
        <div style="display:flex;gap:8px;align-items:center" class="muted">${ic('mic', 'sm')} ${esc(micName(S.settings.mic))}<canvas class="lvl" aria-label="实时音量"></canvas></div></div>
    </div>
    <div class="rec-foot"><div data-live="saveLine">${saveLineHTML()}</div><button type="button" class="btn lg stop" data-act="askStop">结束录制</button></div>
  </div>`;
}
function finCardHTML() {
  const f = S.fin, L = f.lessonId && lessonById(f.lessonId);
  const pct = Math.round(f.up / f.total * 100);
  return `<div class="card"><div class="eyebrow">${L ? `${esc(L.course)} · ${esc(L.student)} · ` : '临时录制 · '}${hm(f.startedAt)}–${hm(f.endedAt)}</div>
    <div class="card-title">${S.net ? '录制已结束，正在上传录音' : '网络已断开，联网后自动上传'}</div>
    <div class="card-sub">${L ? '上传完成后开始生成报告。' : '上传完成后请选择对应的课程。'}可以关闭窗口，上传会在后台继续。</div>
    <div class="bar"><i data-live="finBar" style="width:${pct}%"></i></div></div>`;
}
function lessonStatus(L) {
  const R = L.reportId && reportById(L.reportId);
  switch (L.status) {
    case 'done': { const c = copyState(R); return c === 'copied' ? `<span class="st ok"><span class="d"></span>已复制</span>` : c === 'edited' ? `<span class="st warn"><span class="d"></span>已修改，请重新复制</span>` : `<span class="st todo"><span class="d"></span>待复制</span>`; }
    case 'processing': return `<span class="st"><span class="spin"></span>报告生成中</span>`;

    case 'uploading': return `<span class="st"><span class="spin"></span>上传中</span>`;
    case 'missed': return `<span class="st warn"><span class="d"></span>未录制</span>`;
    case 'skipped': return `<span class="st faint">这节不录</span>`;
    case 'cancelled': return `<span class="st faint">已取消</span>`;

}

  return '';
}
function todayHTML() {
  const lessons = visibleLessons();
  const toCopy = todoReports().filter(r => r.status === 'ready').length;
  const failed = S.reports.filter(r => r.status === 'failed').length;
  const todos = [];
  if (failed) todos.push(['warn', 'alert', `${failed} 份报告没有生成成功`, '查看']);
  if (S.unassigned.length) todos.push(['warn', 'inbox', `${S.unassigned.length} 段录音需要选择对应的课程`, '去选择']);

    <div class="page-head"><h1>今天<span class="date">10月15日 周四</span></h1><button type="button" class="btn" data-act="askTemp" ${S.rec ? 'disabled title="正在录制"' : ''}>临时录制</button></div>
    ${cardHTML()}
    ${todos.map(t => `<div class="todo-row ${t[0]}">${ic(t[1], 'sm')}<span class="tt">${t[2]}</span><button type="button" class="btn" data-act="openTodo">${t[3]}</button></div>`).join('')}
    ${lessons.length ? `<section class="sec"><div class="sec-head"><h2>今日课表</h2><span class="muted">飞书同步于 <span data-live="sync">${lastSync()}</span></span></div><div class="sched">${lessons.map(L => `<div class="lr ${L.status === 'cancelled' ? 'cancel' : L.status === 'recording' ? 'cur' : ''}"><div class="lt">${L.start}–${L.end}</div><div class="ln"><b>${esc(L.course)} · ${esc(L.student)}</b><span>${esc(L.topic)}</span></div><div class="la">${lessonStatus(L)}${lessonAction(L)}</div></div>`).join('')}</div></section>` : ''}
  </div>`;
}

/* ---------- 报告 ---------- */
function reportStatusHTML(R) {
  if (R.status === 'processing') return `<span class="st"><span class="spin"></span>报告生成中</span>`;
  if (R.status === 'failed') return `<span class="st warn"><span class="d"></span>生成失败</span>`;
  const c = copyState(R);
  if (c === 'copied') return `<span class="st ok"><span class="d"></span>已复制 ${R.copiedAt}</span>`;
  if (c === 'edited') return `<span class="st warn"><span class="d"></span>已修改，请重新复制</span>`;
  return `<span class="st todo"><span class="d"></span>待复制${R.gap ? ' · 录音有缺失' : ''}</span>`;
}
function listItems() {
  const rs = S.filter === 'todo' ? S.reports.filter(r => needsAction(r) || r.id === S.stick) : S.reports.filter(r => ['ready', 'processing', 'failed'].includes(r.status));
  const items = rs.map(r => ({ id: r.id, date: r.date, start: r.start, r }));
  if (S.filter === 'todo') S.unassigned.forEach(u => items.push({ id: u.id, date: u.date, start: u.start, u }));
  return items.sort((a, b) => (b.date + b.start).localeCompare(a.date + a.start));
}
function reportsHTML() {
  const items = listItems();
  if (!items.find(i => i.id === S.sel)) S.sel = items[0] ? items[0].id : null;
  let list = '', lastDate = '';
  for (const it of items) {
    if (it.date !== lastDate) { list += `<div class="rl-date">${dateLabel(it.date)}</div>`; lastDate = it.date; }
    if (it.r) list += `<button type="button" class="rl-row ${S.sel === it.id ? 'on' : ''}" data-act="sel" data-arg="${it.id}"><div class="rl-top"><b>${esc(it.r.course)} · ${esc(it.r.student)}</b><span>${it.r.start}</span></div>${reportStatusHTML(it.r)}</button>`;
    else list += `<button type="button" class="rl-row ${S.sel === it.id ? 'on' : ''}" data-act="sel" data-arg="${it.id}"><div class="rl-top"><b>临时录制 · ${durMin(it.u.start, it.u.end)} 分钟</b><span>${it.u.start}</span></div><span class="st warn"><span class="d"></span>请选择课程</span></button>`;
  }
  if (!items.length) list = `<div class="empty"><div class="em-ic">${ic('check')}</div><div class="em-t">都处理完了</div><div>新报告生成后会出现在这里。</div></div>`;
  return `<div class="rp">
    <div class="rl"><div class="rl-head"><h1>报告</h1><div class="seg" role="tablist">
      <button type="button" role="tab" class="${S.filter === 'todo' ? 'on' : ''}" data-act="filter" data-arg="todo">待处理 <span class="n">${todoCount()}</span></button>
      <button type="button" role="tab" class="${S.filter === 'all' ? 'on' : ''}" data-act="filter" data-arg="all">全部</button>
    </div></div><div class="rl-list" data-scroll="rl">${list}</div></div>
    <div class="rd" data-scroll="rd">${S.sel && S.sel.startsWith('u') ? unassignedHTML() : reportDetailHTML()}</div>
  </div>`;
}
function reportDetailHTML() {
  const R = reportById(S.sel);
  if (!R) return `<div class="empty" style="padding-top:120px"><div class="em-t">选择一份报告</div></div>`;
  const head = `<div class="rd-title">${esc(R.course)} · ${esc(R.student)}</div><div class="rd-sub">${esc(R.topic)} · ${dateCN(R.date)} ${R.start}–${R.end}</div>`;
  if (R.status === 'processing') return `<div class="rd-in">${head}<div class="notice">${ic('clock')}<span>报告生成中，完成后会通知你。录音已全部上传。</span></div></div>`;
  if (R.status === 'failed') return `<div class="rd-in">${head}<div class="notice warn">${ic('alert')}<span>报告没有生成成功。录音已安全保存，不会丢失。</span></div><p class="muted" style="margin:10px 0 16px">原因：语音转写超时。再次失败时管理员会收到提醒。</p><button type="button" class="btn primary" data-act="retry">${ic('refresh', 'sm')} 重试生成报告</button></div>`;
  const n = chars(R.summary), c = copyState(R);
  const stateTxt = c === 'copied' ? `<span class="st ok">${ic('check', 'sm')} ${R.copiedAt} 已复制</span>` : c === 'edited' ? `<span class="st warn"><span class="d"></span>已修改，请重新复制</span>` : `<span class="muted">复制后粘贴到微信发给家长</span>`;
  return `<div class="rd-in">${head}
    ${R.gap ? `<div class="notice warn">${ic('alert')}<span>录音缺失约 3 分钟（${R.gap}，网络中断），这段内容没有写进报告。</span></div>` : ''}
    ${R.late ? `<div class="notice">${ic('clock')}<span>${esc(R.late)}</span></div>` : ''}
    <section class="sum"><div class="sum-head"><span class="label">家长总结</span><span class="muted" data-live="chars" ${n > 450 ? 'style="color:var(--warn)"' : ''}>${n} 字${n > 450 ? '，在微信里偏长' : ''}</span></div>
      <textarea id="sum-${R.id}" class="sum-text" data-input="summary" spellcheck="false" aria-label="家长总结，可以直接修改">${esc(R.summary)}</textarea>
      <div class="sum-foot"><button type="button" class="btn primary lg" data-act="copy">${ic('copy', 'sm')} 复制总结</button><span>${stateTxt}</span></div>
    </section>
    <div class="more-acts">
      <button type="button" class="btn" data-act="openFull">${ic('external', 'sm')} 查看完整报告</button>
      <button type="button" class="btn" data-act="copyLink">${ic('link', 'sm')} ${R.linkOn ? '复制家长报告链接' : '生成新的家长报告链接'}</button>
      <button type="button" class="btn" data-act="pdf">${ic('download', 'sm')} 下载 PDF</button>
      <button type="button" class="btn icon ghost" data-act="menu" aria-label="更多">${ic('more', 'sm')}</button>
      ${S.menu ? `<div class="menu" role="menu">${c === 'todo' ? `<button type="button" data-act="markCopied">标为已复制</button>` : `<button type="button" data-act="unmark">标为待复制</button>`}<div class="sep"></div><button type="button" class="danger" data-act="askUnlink" ${R.linkOn ? '' : 'disabled'}>停用家长报告链接</button></div>` : ''}
    </div>
  </div>`;
}

    ${U.candidates.length ? `<div class="sec-head" style="margin-top:22px"><h2>按录音时间，从飞书课表里找到这些课</h2></div>

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => false);
  return Promise.resolve(false);
}
const A = {

function setNow(t) {
  if (t <= S.now) return;
  S.prevNow = S.now; S.now = t;
  if (S.rec && S.net) S.rec.up = Math.floor((Math.min(t, S.rec.stopAt || t) - S.rec.startedAt) / 30);
  evaluate(); S.prevNow = S.now;
}
function scene(name) {
  const keep = { platform: S.platform, theme: S.theme };
  S = Object.assign(createState(), keep);
  $('#notifs').innerHTML = '';
  S.quiet = true;
  if (name === 'rec') setNow(T('16:42'));
  else if (name === 'ending') setNow(T('17:05'));
  else if (name === 'stopped') setNow(T('17:10'));
  else if (name === 'missed') { S.appWasClosed = true; setNow(T('16:20')); S.appWasClosed = false; }
  else if (name === 'temp') { S.page = 'reports'; S.filter = 'todo'; S.sel = 'u1'; }
  else if (name === 'failed') { S.page = 'reports'; S.filter = 'todo'; S.sel = 'r7'; }
  else if (name === 'empty') S.emptyDay = true;
  else if (name === 'onboard') S.onboard = 1;
  S.quiet = false;
}

    else if (S.silent) toast('开始录制后会出现「没有声音」提醒');
  }
  else if (key === 'ready') { if (S.fin) { S.fin.up = S.fin.total; finishFin(); } S.reports.forEach(r => { if (r.status === 'processing') r.readyAt = S.now; }); evaluate(); }
  else if (key === 'platform') S.platform = arg;
  else if (key === 'theme') { S.theme = arg; if (arg === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', arg); readColors(); }
  render();
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const d = e.target.closest('[data-demo]');
  if (d) { demo(d.dataset.demo, d.dataset.arg); if (window.innerWidth <= 1440 && d.dataset.demo === 'scene') $('#demo').classList.remove('open'); return; }
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); }
    if (S.trayOpen && !e.target.closest('#trayMenu')) { S.trayOpen = false; renderShell(); }
    return;
  }
  if (el.disabled) return;
  const act = el.dataset.act;
  if (act !== 'tray' && S.trayOpen) S.trayOpen = false;
  if (act !== 'menu' && S.menu && !el.closest('.menu')) S.menu = null;
  const n = el.closest('.notif'); if (n) n.remove();
  if (A[act]) A[act](el.dataset.arg, e);
});
let editTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input !== 'summary') return;
  const R = reportById(S.sel); const before = copyState(R); R.summary = t.value;
  const n = chars(R.summary), c = document.querySelector('[data-live="chars"]');
  if (c) { c.textContent = n + ' 字' + (n > 450 ? '，在微信里偏长' : ''); c.style.color = n > 450 ? 'var(--warn)' : ''; }
  if (copyState(R) !== before) { clearTimeout(editTimer); editTimer = setTimeout(render, 400); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'mic') {
    S.settings.mic = t.value;
    if (S.rec && S.rec.silentWarn) { S.silent = false; S.rec.silentWarn = false; toast(`已切换到 ${micName(t.value)}，录音继续`); }
    render();
  } else if (t.dataset.change === 'pick') { S.pickC = t.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.browser) S.browser = null; else if (S.modal) S.modal = null; else { S.menu = null; S.trayOpen = false; }
  render();
});
$('#demoToggle').addEventListener('click', () => $('#demo').classList.toggle('open'));

/* ================= 时钟（1 秒 = 模拟 1 秒） ================= */
setInterval(() => {
  if (S.onboard) return;
  S.prevNow = S.now; S.now += 1;
  let dirty = false;
  if (S.rec && S.net) S.rec.up = Math.min(Math.floor((S.now - S.rec.startedAt) / 30), S.rec.up + 3);
  if (S.fin && S.net) { S.fin.up = Math.min(S.fin.total, S.fin.up + 8); if (S.fin.up >= S.fin.total) { finishFin(); dirty = true; } }
  if (evaluate()) dirty = true;
  if (dirty) { render(); return; }
  const set = (k, v) => document.querySelectorAll(`[data-live="${k}"]`).forEach(el => { if (el.innerHTML !== v) el.innerHTML = v; });
  const t = hm(S.now);
  set('mbClock', `10月15日 周四 ${t}`); set('tbClock', t); set('demoClock', t); set('sync', lastSync());
  if (S.rec) { set('elapsed', hms(S.now - S.rec.startedAt)); set('saveLine', saveLineHTML()); }
  if (S.fin) { const b = document.querySelector('[data-live="finBar"]'); if (b) b.style.width = Math.round(S.fin.up / S.fin.total * 100) + '%'; }
}, 1000);

/* ================= 音量条 ================= */
let colors = {};
function readColors() { const cs = getComputedStyle(document.documentElement); colors = { line: cs.getPropertyValue('--line-2').trim(), ok: cs.getPropertyValue('--ok').trim(), rec: cs.getPropertyValue('--rec').trim() }; }
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
let env = 0.4, envT = 0, level = 0;
function nextLevel() {
  if (S.silent) return 0.02;
  envT -= 1; if (envT <= 0) { env = Math.random() < 0.18 ? 0.05 : 0.3 + Math.random() * 0.6; envT = 4 + Math.random() * 14; }
  return Math.min(1, env * (0.5 + Math.random() * 0.7));
}
function drawLevel(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (!W || !H) return;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d'), segs = 14, sw = W / segs;
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < segs; i++) { ctx.fillStyle = i / segs < level ? (cv.closest('.rec') ? colors.rec : colors.ok) : colors.line; ctx.fillRect(i * sw + dpr, 2 * dpr, sw - 2 * dpr, H - 4 * dpr); }
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
setInterval(() => { level = nextLevel(); document.querySelectorAll('canvas.lvl').forEach(drawLevel); }, reduce ? 1000 : 90);

/* ================= 启动 ================= */
const h = location.hash.slice(1);
if (SCENES.some(s => s[0] === h) || h === 'empty' || h === 'onboard') scene(h);
render();
})();
</script>
