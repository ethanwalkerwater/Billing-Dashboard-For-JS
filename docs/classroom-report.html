<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课堂学情报告 · 菁仕教育</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--paper:#fff;--text:#16181d;--muted:#5d6573;--line:#e3e6eb;--accent:#2f6bff;--soft:#e8efff;--ok:#177648;--warn:#92621b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--paper:#171a20;--text:#eceef2;--muted:#a3aab6;--line:#2a2f38;--accent:#91b0ff;--soft:#1b2540;--ok:#74d9a6;--warn:#edc57e}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button,a{touch-action:manipulation}
.toolbar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}
.toolbar-inner{max-width:960px;margin:auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.back{text-decoration:none;color:var(--muted);font-size:13px}.download{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#2f6bff;color:#fff;text-decoration:none;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600}
.download:hover{background:#2459dc}.download svg{width:17px;height:17px}
main{max-width:904px;margin:36px auto 64px;padding:44px 52px 28px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}.mark{display:grid;place-items:center;width:30px;height:30px;background:#2f6bff;color:#fff;border-radius:8px}.sample{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400;border:1px solid var(--line);padding:2px 9px;border-radius:6px}
.eyebrow{margin-top:36px;color:var(--accent);font-size:13px;font-weight:600;letter-spacing:2px}h1{font-size:34px;line-height:1.35;letter-spacing:-1px;margin:8px 0 12px}.meta{color:var(--muted);font-size:14px}.lead{font-size:19px;line-height:1.7;margin:26px 0 24px;max-width:650px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);padding:18px 0;border-block:1px solid var(--line)}.facts div+div{border-left:1px solid var(--line);padding-left:26px}.facts small{display:block;color:var(--muted);font-size:12px}.facts b{font-size:18px;font-weight:600}
section{margin-top:34px}h2{display:flex;align-items:baseline;gap:12px;font-size:19px;line-height:1.5;margin:0 0 16px}h2 small{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:500}p{margin:0}ol,ul{margin:0;padding-left:22px}li+li{margin-top:8px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;background:var(--bg)}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}th:first-child,td:first-child{padding-left:0;width:28%}td:nth-child(2){width:20%;font-weight:600;white-space:nowrap}.good{color:var(--ok)}.practice{color:var(--warn)}.evidence{color:var(--muted)}
.insight{border-left:3px solid var(--accent);padding:2px 0 2px 18px}.issue{padding:18px 20px;background:var(--bg);border-radius:10px}.issue b{display:block;margin-bottom:6px}.plan{display:grid;grid-template-columns:1fr 1fr;gap:26px}.plan h3{font-size:14px;margin:0 0 8px}.plan p{color:var(--muted);font-size:14px}.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media(max-width:640px){.toolbar-inner{padding:12px 16px}.back{font-size:12px}.download{padding:8px 12px}main{margin:16px 12px 32px;padding:28px 20px;border-radius:12px}h1{font-size:28px}.lead{font-size:17px}.facts b{font-size:16px}.facts div+div{padding-left:12px}.plan{grid-template-columns:1fr;gap:18px}th,td{padding:10px 6px}table{font-size:12px}td:nth-child(2){white-space:normal}.sample{font-size:11px}}
.tl{position:relative;height:28px;border-radius:8px;background:var(--bg);overflow:hidden}.tl i{position:absolute;top:0;bottom:0;box-shadow:inset -2px 0 0 var(--paper)}.tl-axis{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.p0{background:#8b5cf6}.p1{background:#2f6bff}.p2{background:#06b6d4}.p3{background:#16a34a}.p4{background:#f59e0b}.p5{background:#ec4899}.p6{background:#cbd5e1}
.legend,.steps{list-style:none;padding:0}.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin:14px 0 0;font-size:14px}.legend li{display:flex;align-items:center;gap:6px;margin:0}.legend b{font-weight:600}.legend span{color:var(--muted);font-size:12px}.legend i,.steps i{width:10px;height:10px;border-radius:3px}
.steps{margin:18px 0 0;border-top:1px solid var(--line);font-size:14px}.steps li{display:grid;grid-template-columns:104px 10px 36px 1fr;align-items:center;gap:10px;margin:0;padding:7px 0;border-bottom:1px solid var(--line)}.steps b{font-weight:600}.when{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:12px}.bar{display:grid;grid-template-columns:minmax(0,30%) 1fr 116px;align-items:center;gap:14px;font-size:14px}.track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent);border-radius:5px}.bar b{color:var(--muted);font-size:13px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.qs{display:grid;gap:12px;margin-top:12px}.q{margin:0;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px}.q blockquote{margin:2px 0 0;font-size:16px;font-weight:600}.q figcaption{margin-top:6px;color:var(--muted);font-size:14px}
@media(max-width:640px){.steps li{grid-template-columns:88px 10px 32px 1fr;gap:8px;font-size:13px}.bar{grid-template-columns:1fr 96px;gap:6px 10px}.bar span{grid-column:1/-1}.legend{gap:6px 16px}}
@media print{.tl,.legend,.steps li,.bar,.q{break-inside:avoid}.q blockquote{font-size:12pt}}
@page{size:A4;margin:18mm 18mm}
@media print{html{color-scheme:light}body{background:#fff;color:#16181d;font-size:11pt;--bg:#f6f7f9;--paper:#fff;--text:#16181d;--muted:#5d6573;--line:#e3e6eb;--accent:#2f6bff;--ok:#177648;--warn:#92621b;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar{display:none}main{margin:0;padding:0;max-width:none;border:0;border-radius:0}.eyebrow{margin-top:28px}h1{font-size:28pt}.lead{font-size:15pt}.facts b{font-size:14pt}section{margin-top:26px}h2{font-size:15pt;break-after:avoid}table{font-size:10pt}tr,.issue,.plan,.insight{break-inside:avoid}.foot{font-size:9pt}.plan{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav class="toolbar" aria-label="报告操作"><div class="toolbar-inner"><a class="back" href="MVP.html">← 返回菁仕课堂</a><a class="download" id="download" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5"/></svg>下载 PDF</a></div></nav>
<main id="report"></main>
<script src="mvp-data.js"></script>
<script>
// shortcut: PDF 为演示数据预生成，更新数据后运行 verify-classroom-report.mjs，接入真实课堂后改用服务端下载。
const details = {
  physics:{
    lead:'能独立完成受力分析，下一步重点是让计算中的单位保持一致。',
    mastery:[['合力与 F = ma','基本掌握','能解释合力不变时，质量与加速度成反比。'],['受力分析','基本掌握','能独立画出完整受力图，并完成最后一道斜面题。'],['单位换算','需要巩固','计算中两次混用 g 和 kg，需在代入公式前统一单位。']],
    issue:'质量单位混用',fix:'先将质量统一换算为 kg，再代入 F = ma；答案同时写出物理量与单位。',review:'重新独立完成课堂的 3 道例题，每次代入公式前检查单位。',next:'动量：衔接受力分析与运动状态的变化。',
    flow:[['复习','回顾上节课的受力图',.1,[1]],['讲解','合力与 F = ma',.25,[0]],['例题','斜面上的受力分析',.2,[1,0]],['练习','3 道计算题',.25,[0,2]],['答疑','单位换算',.12,[2]],['总结','作业与下节课',.08,[]]],
    questions:[[.55,'如果斜面有摩擦，合力的方向还是沿斜面向下吗？','老师画受力图说明：先比较摩擦力和重力沿斜面的分量，再判断合力方向。'],[.8,'g 和 kg 什么时候需要换算？','代入 F = ma 前统一换成 kg，这也是本课的易错点。']]
  },
  math:{
    lead:'配方法与作图已有基础，审题时还需要主动检查取值条件。',
    mastery:[['二次函数的三种形式','本课已学习','完成一般式、顶点式与交点式的转换练习。'],['配方法与作图','基本掌握','配方步骤熟练，作图能正确标出开口方向和顶点。'],['解与取值条件','需要巩固','有一题漏看 x > 0，多保留了一个解。']],
    issue:'遗漏题目的取值限制',fix:'解题前圈出定义域与限制条件；求出解后逐一代回条件筛选。',review:'复做课堂的 2 道作图真题，在图上标记题目要求的取值范围。',next:'二次不等式：结合函数图像判断取值区间。',
    flow:[['复习','一次函数图像',.08,[]],['讲解','三种形式互相转换',.3,[0]],['例题','配方求顶点',.2,[1]],['练习','2 道作图真题',.27,[1,2]],['答疑','取值条件',.1,[2]],['总结','作业与下节课',.05,[]]],
    questions:[[.4,'为什么配方以后就能直接看出顶点？','老师把顶点式和图像平移联系起来，学生随后自己说出了对称轴。']]
  },
  ielts:{
    lead:'能够完整表达两分钟并使用新词，接下来聚焦过去时的稳定性。',
    mastery:[['Part 2 内容组织','基本掌握','能按时间、地点、经过和感受组织内容，完整讲满 2 分钟。'],['旅行话题表达','开始运用','学习 6 个表达，并主动使用其中 2 个。'],['过去时与 Part 3','需要巩固','曾将 went 说成 go；延伸讨论继续练习观点后补充理由。']],
    issue:'叙述过去经历时切回现在时',fix:'录音后圈出描述过去的动词，逐一检查过去式，再重说同一段内容。',review:'每天录制 1 分钟 Part 2 回答，重点检查过去时和具体细节。',next:'Part 2 人物描述：迁移内容组织方法与细节表达。',
    flow:[['其他','开场热身',.06,[]],['讲解','Part 2 四步组织法',.2,[0]],['练习','模拟答题 2 分钟',.3,[0,1]],['讲解','旅行话题表达',.16,[1]],['练习','Part 3 延伸讨论',.2,[2]],['总结','回顾过去时错误',.08,[2]]],
    questions:[[.45,'Can I say "I have been to Paris last year"?','有具体的过去时间要用一般过去时：I went to Paris last year.'],[.7,'Part 3 观点不够的时候，可以先讲自己的经历吗？','可以，先给观点再用经历举例，正是本课练的回答结构。']]
  },
  chem:{
    lead:'摩尔换算掌握扎实，限量试剂判断仍需要针对性练习。',
    mastery:[['摩尔与质量换算','基本掌握','能完成质量、摩尔数与粒子数之间的换算。'],['化学计量计算','本课已学习','练习配平方程式后，依据系数比进行计算。'],['限量试剂判断','需要巩固','课堂 3 道题答对 2 道，需要稳定判断过程。']],
    issue:'限量试剂判断不够稳定',fix:'先配平方程式，再比较各反应物的物质的量与系数之比，以较小者确定限量试剂。',review:'完成课本第 4 章限量试剂练习，每题写出判断依据。',next:'气体体积计算：衔接物质的量与气体体积。',
    flow:[['复习','摩尔质量',.12,[0]],['讲解','方程式系数比',.25,[1]],['例题','限量试剂判断',.2,[2]],['练习','3 道限量试剂题',.3,[2,1]],['总结','错题回顾',.13,[2]]],
    questions:[]
  },
  part1:{
    lead:'能回答熟悉话题，接下来练习用理由和例子把回答说完整。',
    mastery:[['熟悉话题应答','基本掌握','练习回答家乡、学习与日常生活话题。'],['回答结构','本课已学习','采用直接回答、补充理由与举例的结构。'],['细节展开','需要巩固','部分回答较短，需要加入具体经历或例子。']],
    issue:'回答过短，缺少展开',fix:'直接回答后补充一个理由，再用一个具体例子支撑。',review:'每天选择 3 道 Part 1 题，每题录音 20–30 秒，并检查理由和例子。',next:'继续巩固 Part 1 的回答展开；具体话题待老师安排。',
    flow:[['讲解','回答结构',.25,[1]],['练习','家乡与学习话题',.4,[0,1]],['练习','补充理由和例子',.25,[2]],['总结','反馈与作业',.1,[]]],
    questions:[[.6,'没有真实经历的话，可以编一个例子吗？','可以，但细节要具体、前后一致，考官看的是表达。']]
  }
};
// 以下三个函数与 apps/classroom-recorder/src/report/main.ts 一致
const PHASES = ['复习', '讲解', '例题', '练习', '答疑', '总结', '其他'];
const clock = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const minutes = s => `${Math.max(1, Math.round(s / 60))} 分钟`;
const pct = (part, whole) => `${Math.round((part / whole) * 100)}%`;
function timelineSection(t) {
  const end = t.at(-1).end;
  const total = t.reduce((sum, s) => sum + s.end - s.start, 0);
  const byPhase = PHASES.map((phase, i) => ({ phase, i, secs: t.filter(s => s.phase === phase).reduce((sum, s) => sum + s.end - s.start, 0) })).filter(p => p.secs > 0);
  const cls = phase => `p${Math.max(0, PHASES.indexOf(phase))}`;
  return `<div class="tl" role="img" aria-label="${byPhase.map(p => `${p.phase}${minutes(p.secs)}`).join('，')}">${t.map(s => `<i class="${cls(s.phase)}" style="left:${(s.start / end) * 100}%;width:${((s.end - s.start) / end) * 100}%" title="${clock(s.start)}–${clock(s.end)} ${s.phase} · ${s.title}"></i>`).join('')}</div>
    <div class="tl-axis"><span>00:00</span><span>${clock(end / 2)}</span><span>${clock(end)}</span></div>
    <ul class="legend">${byPhase.map(p => `<li><i class="p${p.i}"></i>${p.phase}<b>${minutes(p.secs)}</b><span>${pct(p.secs, total)}</span></li>`).join('')}</ul>
    <ol class="steps">${t.map(s => `<li><span class="when">${clock(s.start)}–${clock(s.end)}</span><i class="${cls(s.phase)}"></i><b>${s.phase}</b><span>${s.title}</span></li>`).join('')}</ol>`;
}
function pointTimeSection(t) {
  const total = t.reduce((sum, s) => sum + s.end - s.start, 0);
  const secs = new Map();
  for (const s of t) for (const p of s.points) secs.set(p, (secs.get(p) ?? 0) + (s.end - s.start) / s.points.length);
  const rows = [...secs].sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '';
  const max = rows[0][1];
  return `<div class="bars">${rows.map(([name, v]) => `<div class="bar"><span>${name}</span><div class="track"><i style="width:${(v / max) * 100}%"></i></div><b>${minutes(v)} · ${pct(v, total)}</b></div>`).join('')}</div>`;
}
const lessonId = new URLSearchParams(location.search).get('lesson');
const lesson = lessons.find(l => l.id === lessonId && l.status !== 'cancelled');
const report = document.getElementById('report');
if (!lesson) {
  document.title = '未找到报告 · 菁仕教育';
  report.innerHTML = '<h1>未找到这份课堂报告</h1><p>请从菁仕课堂中选择已完成的课程，再打开完整报告。</p>';
} else {
  const d = details[lesson.id === 'zihan2' ? 'part1' : lesson.tx];
  const [course, student] = lesson.title.split(' · ');
  const summary = summaryOf(lesson.id);
  const content = summary.split('【今天学了什么】\n')[1].split('\n\n【课堂表现】')[0];
  const performance = summary.split('【课堂表现】\n')[1].split('\n\n【课后建议】')[0];
  const homework = summary.split('【课后建议】\n')[1].split('\n\n')[0];
  const topic = lesson.topic.split(' · ')[0];
  let at = 0;
  const timeline = d.flow.map(([phase, title, share, points]) => {
    const start = at;
    at += Math.round(share * lesson.mins * 60);
    return { phase, title, start, end: at, points: points.map(i => d.mastery[i][0]) };
  });
  const questions = d.questions.map(([share, text, answer]) => ({ time: Math.round(share * lesson.mins * 60), text, answer }));
  const top = [
    ['本课学习内容', `<ul>${content.split('\n').map(line => `<li>${line.replace(/^\d+\.\s*/, '')}</li>`).join('')}</ul>`],
    ['课堂时间分布', timelineSection(timeline)],
    ['知识点用时', pointTimeSection(timeline)],
    ['知识点掌握情况', `<div class="table-wrap"><table><thead><tr><th scope="col">知识点</th><th scope="col">课堂表现</th><th scope="col">判断依据</th></tr></thead><tbody>${d.mastery.map(([name, status, evidence]) => `<tr><td>${name}</td><td class="${status === '需要巩固' ? 'practice' : 'good'}">${status}</td><td class="evidence">${evidence}</td></tr>`).join('')}</tbody></table></div>`],
  ];
  const bottom = [
    ...(questions.length ? [['主动提问', `<p class="meta">${student}这节课主动提了 ${questions.length} 个问题：</p><div class="qs">${questions.map(q => `<figure class="q"><span class="when">${clock(q.time)}</span><blockquote>“${q.text}”</blockquote><figcaption>${q.answer}</figcaption></figure>`).join('')}</div>`]] : []),
    ['学生课堂表现', `<p class="insight">${performance}</p>`],
    ['易错点与改进方法', `<div class="issue"><b>${d.issue}</b><p>${d.fix}</p></div>`],
    ['课后巩固计划', `<div class="plan"><div><h3>作业与练习</h3><p>${homework}</p></div><div><h3>复习方法</h3><p>${d.review}</p></div></div>`],
    ['下节课衔接', `<p>${d.next}</p>`],
  ];
  const section = ([title, body], i) => `<section><h2><small>${String(i + 1).padStart(2, '0')}</small>${title}</h2>${body}</section>`;
  document.title = `${student}_${course}_${lesson.date}_课堂学情报告`;
  const download = document.getElementById('download');
  download.href = `../outputs/classroom-reports/${lesson.id}.pdf`;
  download.download = `${student}_${course}_${lesson.date}_课堂学情报告.pdf`;
  download.hidden = false;
  // file:// 下浏览器忽略本地文件的 download 属性，使用预生成的 data URL 支持直接下载。
  if (location.protocol === 'file:') {
    download.hidden = true;
    const pdfScript = document.createElement('script');
    pdfScript.src = `../outputs/classroom-reports/${lesson.id}.pdf.js`;
    pdfScript.onload = () => { download.hidden = false; };
    document.body.append(pdfScript);
  }
  report.innerHTML = `
    <div class="brand"><span class="mark">菁</span>菁仕教育<span class="sample">演示报告 · 示例数据</span></div>
    <div class="eyebrow">课堂学情报告</div><h1>${course} · ${topic}</h1>
    <p class="meta">${student} · 王老师 · ${lesson.date.replaceAll('-', '.')} · ${lesson.time}</p>
    <p class="lead">${d.lead}</p>
    <div class="facts"><div><small>学生</small><b>${student}</b></div><div><small>课堂记录时长</small><b>${lesson.mins} 分钟</b></div><div><small>学习重点</small><b>${d.mastery.length} 项</b></div></div>
    ${top.map(section).join('')}
    <div class="report-bottom">
      ${bottom.map((s, i) => section(s, top.length + i)).join('')}
