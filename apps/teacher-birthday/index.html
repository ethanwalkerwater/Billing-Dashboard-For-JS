<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b1f" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>生日快乐</title>
  </head>
  <body class="locked">
    <main id="app">
      <section id="envelope" aria-live="polite">
        <div class="loading" id="loading">
          <span class="spark"></span>
          <p>正在打开你的礼物</p>
        </div>
        <div class="problem" id="problem" hidden>
          <p id="problem-text"></p>
          <button type="button" id="retry" class="pill" hidden>再试一次</button>
        </div>
        <button type="button" class="letter" id="letter" hidden aria-label="拆开信封">
          <span class="letter-body">
            <span class="letter-to" id="letter-to"></span>
            <span class="letter-from">来自菁仕的同学和同事们</span>
          </span>
          <span class="letter-flap"></span>
          <span class="letter-seal">菁</span>
        </button>
        <p class="tap-hint" id="tap-hint" hidden>轻点信封</p>
      </section>

      <section id="stage" hidden>
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="css-cake" aria-hidden="true"><div class="tier top"></div><div class="tier bottom"></div><div class="css-candles" id="css-candles"></div></div>
        <h1 class="stage-title" id="stage-title"></h1>
        <p class="stage-hint" id="stage-hint">对着手机吹一口气，或者长按蛋糕</p>
        <div class="sky-caption" id="sky-caption" hidden>
          <p class="sky-line" id="sky-line"></p>
          <p class="sky-sub" id="sky-sub"></p>
          <button type="button" class="pill" id="to-wall">读祝福</button>
        </div>
      </section>

      <section id="wall" hidden>
        <h2 id="wall-title">大家想对你说</h2>
        <div class="cards" id="cards"></div>
      </section>

      <section id="finale" hidden>
        <figure class="portrait" id="portrait" hidden><img id="portrait-img" alt="" /></figure>
        <p class="tenure" id="tenure" hidden></p>
        <p class="stats" id="stats" hidden></p>
        <div class="blessing" id="blessing"></div>
        <p class="signature" id="signature"></p>
      </section>
    </main>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
