<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>取消课程 · 菁仕</title>
  <!--
    学生自助取消课程的选课页（静态托管 /cancel/，学生专属链接 /cancel/?t=<token>）。
    只负责「选哪节课」：确认后由 cancel-api 生成一次性取消编号，再跳转飞书问卷填写原因。
    收费档位以提交问卷的时间为准，这里的提示每 30 秒按当前时间刷新。
    部署：npm run deploy:cancel-page
  -->
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --ink: #16181d;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #24149a;
      --brand-soft: #efedff;
      --warn: #b45309;
      --warn-soft: #fff7ed;
      --danger: #b91c1c;
      --free: #047857;
      --free-soft: #ecfdf5;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); }
    .brand { color: var(--brand); font-weight: 600; letter-spacing: .08em; font-size: 13px; }
    h1 { margin: 6px 0 4px; font-size: 24px; }
    .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .rules { margin-bottom: 18px; padding: 14px 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
    .rules summary { cursor: pointer; font-weight: 600; font-size: 14px; }
    .rules table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 13px; }
    .rules td { padding: 6px 0; border-top: 1px solid var(--line); }
    .rules td:last-child { text-align: right; font-weight: 600; }
    .lesson {
      display: block; width: 100%; margin-bottom: 10px; padding: 14px 16px; text-align: left;
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: inherit; font: inherit;
    }
    button.lesson { cursor: pointer; }
    button.lesson:active { border-color: var(--brand); }
    .lesson-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .lesson-time { font-weight: 600; font-variant-numeric: tabular-nums; }
    .lesson-course { margin-top: 2px; }
    .lesson-teacher { color: var(--muted); font-size: 13px; }
    .tag { flex: none; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .tag.charge { color: var(--warn); background: var(--warn-soft); }
    .tag.free { color: var(--free); background: var(--free-soft); }
    .tag.muted { color: var(--muted); background: var(--bg); }
    .lesson[disabled] { opacity: .65; }
    .empty, .error { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); }
    .error { color: var(--danger); }
    .sheet-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / .4); display: none; align-items: flex-end; justify-content: center; }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: 100%; max-width: 560px; padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
      background: var(--card); border-radius: 18px 18px 0 0;
    }
    .sheet h2 { margin: 0 0 4px; font-size: 18px; }
    .sheet .detail { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .fee { padding: 14px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); }
    .fee.free { background: var(--free-soft); color: var(--free); }
    .fee strong { display: block; font-size: 20px; }
    .fee span { font-size: 13px; }
    .actions { display: grid; gap: 10px; margin-top: 18px; }
    .btn { height: 48px; border-radius: 12px; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
    .btn.primary { background: var(--brand); color: #fff; }
    .btn.secondary { background: var(--bg); color: var(--ink); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .note { margin-top: 12px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="brand">菁仕 · KING'S ACADEMY</div>
    <h1 id="title">取消课程</h1>
    <p class="sub" id="subtitle">正在读取你的课表…</p>

    <details class="rules">
      <summary>取消收费规则（以提交问卷的时间为准）</summary>
      <table>
        <tr><td>开课前 6 小时以上</td><td>不收费</td></tr>
        <tr><td>开课前 2–6 小时</td><td>收取 30%</td></tr>
        <tr><td>开课前 2 小时以内</td><td>收取 50%</td></tr>
        <tr><td>已经开课</td><td>收取 70%</td></tr>
        <tr><td>病假（需上传证明，教务核实）</td><td>默认不收费</td></tr>
      </table>
    </details>

    <section id="list" aria-live="polite"></section>
  </main>

  <div class="sheet-backdrop" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet">
      <h2 id="sheetTitle">确认取消这节课？</h2>
      <p class="detail" id="sheetDetail"></p>
      <div class="fee" id="sheetFee"></div>
      <div class="actions">
        <button class="btn primary" id="confirm" type="button">确认取消，去填写原因</button>
        <button class="btn secondary" id="cancel" type="button">再想想</button>
      </div>
      <p class="note">下一步会打开飞书问卷，选择原因并提交后才算取消成功。请在 30 分钟内提交。</p>
    </div>
  </div>

  <script>
    (function () {
      var HOUR = 3600000;
      var token = new URLSearchParams(location.search).get("t") || "";
      var api = "/cancel-api";
      var state = { lessons: [], clockOffset: 0, selected: null };
      var list = document.getElementById("list");
      var sheet = document.getElementById("sheet");

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      // 与 src/cancellation/rules.ts 的 cancellationTier 一致；服务端提交时会再按实际时间计算一次
      function tier(lesson) {
        var lead = lesson.startMs - (Date.now() + state.clockOffset);
        if (lead <= 0) return { text: "已开课，收取 70% 课时费", free: false, tag: "70%" };
        if (lead <= 2 * HOUR) return { text: "收取 50% 课时费", free: false, tag: "50%" };
        if (lead <= 6 * HOUR) return { text: "收取 30% 课时费", free: false, tag: "30%" };
        return { text: "开课前 6 小时以上，不收费", free: true, tag: "免费取消" };
      }

      function leadText(lesson) {
        var lead = lesson.startMs - (Date.now() + state.clockOffset);
        if (lead <= 0) return "课程已开始";
        var minutes = Math.floor(lead / 60000);
        var days = Math.floor(minutes / 1440);
        var hours = Math.floor((minutes % 1440) / 60);
        var rest = minutes % 60;
        if (days > 0) return "距上课 " + days + " 天 " + hours + " 小时";
        if (hours > 0) return "距上课 " + hours + " 小时 " + rest + " 分";
        return "距上课 " + rest + " 分钟";
      }

      function render() {
        list.innerHTML = "";
        if (!state.lessons.length) {
          list.appendChild(el("div", "empty", "接下来 14 天没有可以取消的课程。"));
          return;
        }
        state.lessons.forEach(function (lesson) {
          var available = lesson.status === "available";
          var item = el(available ? "button" : "div", "lesson");
          if (available) {
            item.type = "button";
            item.addEventListener("click", function () { open(lesson); });
          } else {
            item.setAttribute("aria-disabled", "true");
          }
          var top = el("div", "lesson-top");
          top.appendChild(el("span", "lesson-time", lesson.timeLabel));
          var info = available ? tier(lesson) : null;
          top.appendChild(
            available
              ? el("span", "tag " + (info.free ? "free" : "charge"), info.tag)
              : el("span", "tag muted", lesson.status === "cancelled" ? "已取消" : "多人课程"),
          );
          item.appendChild(top);
          item.appendChild(el("div", "lesson-course", lesson.courseName || "未命名课程"));
          var hint = available ? " · " + leadText(lesson) : lesson.status === "group" ? " · 多人同上的课请联系教务取消" : "";
          item.appendChild(el("div", "lesson-teacher", (lesson.teacherName || "") + hint));
          list.appendChild(item);
        });
      }

      function open(lesson) {
        state.selected = lesson;
        var info = tier(lesson);
        document.getElementById("sheetDetail").textContent = lesson.timeLabel + " · " + (lesson.courseName || "") + " · " + (lesson.teacherName || "");
        var fee = document.getElementById("sheetFee");
        fee.className = "fee" + (info.free ? " free" : "");
        fee.innerHTML = "";
        fee.appendChild(el("strong", null, "现在取消：" + info.text));
        fee.appendChild(el("span", null, leadText(lesson) + "。实际收费以提交问卷的时间为准。"));
        sheet.classList.add("open");
        document.getElementById("confirm").focus();
      }

      function close() {
        sheet.classList.remove("open");
        state.selected = null;
      }

      function showError(message) {
        list.innerHTML = "";
        list.appendChild(el("div", "error", message));
      }

      document.getElementById("cancel").addEventListener("click", close);
      sheet.addEventListener("click", function (event) { if (event.target === sheet) close(); });
      document.addEventListener("keydown", function (event) { if (event.key === "Escape") close(); });

      document.getElementById("confirm").addEventListener("click", function () {
        var button = this;
        if (!state.selected) return;
        button.disabled = true;
        button.textContent = "正在生成取消编号…";
        fetch(api + "/intent", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ t: token, recordId: state.selected.recordId }),
        })
          .then(function (response) { return response.json(); })
          .then(function (body) {
            if (!body.ok) throw new Error(body.message || "暂时无法取消，请稍后重试");
            location.href = body.formUrl;
          })
          .catch(function (error) {
            close();
            showError(error.message);
            setTimeout(load, 2500);
          })
          .finally(function () {
            button.disabled = false;
            button.textContent = "确认取消，去填写原因";
          });
      });

      function load() {
        if (!token) {
          document.getElementById("subtitle").textContent = "";
          showError("链接不完整，请使用教务发给你的专属取消链接。");
          return;
        }
        fetch(api + "/lessons?t=" + encodeURIComponent(token))
          .then(function (response) { return response.json(); })
          .then(function (body) {
            if (!body.ok) throw new Error(body.message || "读取课表失败，请稍后重试");
            state.lessons = body.lessons;
            state.clockOffset = body.nowMs - Date.now();
            document.getElementById("title").textContent = body.studentName + " 的课程";
            document.getElementById("subtitle").textContent = "选择要取消的课程。只显示正在上和接下来 14 天的课。";
            render();
          })
          .catch(function (error) {
            document.getElementById("subtitle").textContent = "";
            showError(error.message);
          });
      }

      load();
      setInterval(function () { if (!state.selected) render(); }, 30000);
    })();
  </script>
</body>
</html>
