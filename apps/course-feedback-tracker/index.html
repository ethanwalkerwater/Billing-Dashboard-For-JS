<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 自有域名同时开着 HTTP 和 HTTPS，CloudBase 不会自动跳转；用 http:// 打开时这里立即换成 https://，登录密码不走明文。 -->
    <script>
      if (location.protocol === "http:" && /(^|\.)(jsjy\.asia|tcloudbaseapp\.com)$/.test(location.hostname)) {
        location.replace("https://" + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="菁仕月度课程反馈问卷跟踪系统" />
