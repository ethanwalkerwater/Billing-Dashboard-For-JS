<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>月度课程反馈 · 菁仕教育</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18181b;
      --muted: #52525b;
      --line: #e4e4e7;
      --blue: #1d4ed8;
      --paper: #fff;
      --surface: #fafafa;
      font: 16px/1.5 Geist, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      background: var(--surface);
    }

    * { box-sizing: border-box; }
    body, h1, h2, p { margin: 0; }
    body { min-height: 100svh; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible + span {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    ::selection { background: #dbeafe; color: #1e3a8a; }
    .top { position: sticky; top: 0; z-index: 1; background: var(--paper); border-bottom: 1px solid var(--line); }
    .shell { max-width: 644px; margin: auto; padding-inline: 16px; }
    .progress-shell { padding-block: 0 6px; }
    .progress-line { display: flex; align-items: center; gap: 9px; min-height: 36px; font-size: .8125rem; }
    .brand { font-weight: 650; white-space: nowrap; }
    #course-month { color: var(--muted); }
    #progress-text { margin-left: auto; white-space: nowrap; }
    .tabs { display: flex; gap: 5px; overflow-x: auto; padding: 3px 4px; margin-inline: -4px; scrollbar-width: thin; }
    .tab { flex: 1 0 auto; min-width: 84px; min-height: 44px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink); line-height: 1.3; }
    .tab:hover { background: #f4f4f5; }
    .tab[aria-selected="true"] { border-color: var(--blue); background: #eff6ff; }
    .tab strong { display: block; font-size: .875rem; font-weight: 600; }
    .tab .state { padding: 0; background: transparent; }
    .demo-mode { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 20px; font-size: .8125rem; }
    .demo-mode a { color: var(--blue); text-underline-offset: 3px; }
    .demo-mode [aria-current] { font-weight: 600; color: var(--ink); text-decoration: none; }
    .embed { margin-top: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    /* shortcut: the current Feishu form fits in 2800px at 320px wide. Recheck if its questions change. */
    .embed iframe { display: block; width: 100%; height: 2800px; border: 0; pointer-events: none; }

    main { padding-block: 18px 40px; }
    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -.025em; line-height: 1.3; }
    h1:focus { outline: none; }
    h2 { font-size: 1rem; font-weight: 600; }
    .context { margin-top: 6px; color: var(--muted); font-size: .875rem; }
    .notice { margin-bottom: 16px; padding: 9px 12px; border: 1px solid #bfdbfe; border-radius: 8px; background: #eff6ff; color: #1e3a8a; font-size: .875rem; }
    .notice:empty, [hidden] { display: none; }
    .notice.error { border-color: #fed7aa; background: #fff7ed; color: #9a3412; }
    .state { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 3px 7px; border-radius: 6px; background: #f4f4f5; color: #3f3f46; font-size: .75rem; font-weight: 600; white-space: nowrap; }
    .state[data-state="done"] { color: var(--blue); background: #eff6ff; }
    .state[data-state="draft"] { color: #854d0e; background: #fefce8; }
    svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--paper); font-size: .875rem; font-weight: 600; }
    .button:hover { background: #f4f4f5; }
    .button.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .button.primary:hover { background: #3f3f46; }
    form { margin-top: 20px; }
    .questions { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); padding: 16px; }
    fieldset { min-width: 0; border: 0; padding: 0; margin: 0 0 22px; }
    legend { padding: 0; font-size: .9375rem; font-weight: 600; }
    .scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
    .scale label { position: relative; min-width: 0; cursor: pointer; }
    .scale input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .scale span { display: grid; place-items: center; height: 44px; border-radius: 8px; border: 1px solid #a1a1aa; font-weight: 600; }
    .scale label:hover span { background: #fafafa; }
    .scale input:checked + span { border: 2px solid var(--blue); background: #eff6ff; color: var(--blue); }
    .scale-ends { display: flex; justify-content: space-between; margin-top: 5px; color: var(--muted); font-size: .75rem; }
    .suggestion { display: block; font-size: .9375rem; font-weight: 600; }
    .suggestion span { color: var(--muted); font-size: .8125rem; font-weight: 400; }
    textarea { display: block; width: 100%; margin-top: 8px; min-height: 80px; resize: vertical; border: 1px solid #a1a1aa; border-radius: 8px; padding: 8px 10px; color: inherit; }
    .actions { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; margin-top: 12px; }
    .help { margin-top: 16px; color: var(--muted); font-size: .8125rem; }
    .pilot-note { margin-top: 6px; color: var(--muted); font-size: .8125rem; }
    .form-error { margin: 0 0 12px; }
    @media (min-width: 680px) { .shell { padding-inline: 32px; } main { padding-top: 24px; } .questions { padding: 22px; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="shell progress-shell">
      <div class="progress-line"><span class="brand">菁仕教育</span><span id="course-month"></span><strong id="progress-text"></strong></div>
      <div id="teachers" class="tabs" role="tablist" aria-label="切换老师"></div>
    </div>
  </header>
  <main class="shell">
    <p id="notice" class="notice" role="status"></p>
    <section id="teacher-panel" role="tabpanel">
      <div id="view"></div>
      <div id="embed" class="embed" hidden></div>
    </section>
    <nav class="demo-mode" aria-label="演示模式"><a id="live-mode" href="?mode=feishu">飞书问卷预览</a><a id="local-mode" href="?mode=demo">手机试填</a></nav>
  </main>
  <script id="pilot-data" type="application/json">null</script>
  <script>
    const pilot = JSON.parse(document.querySelector("#pilot-data").textContent);
    const teachers = pilot?.teachers ?? [
      { id: "zhou", name: "周老师", courses: "雅思阅读" },
      { id: "chen", name: "陈老师", courses: "雅思写作、雅思口语" },
      { id: "xu", name: "许老师", courses: "学术英语" },
    ];
    const questions = ["学习提升效果", "责任心与服务态度", "个人魅力"];
    const storageKey = pilot ? "jingshi-pilot:" + location.pathname : "jingshi-demo:xiaohe:2026-10";
    const sample = pilot ? {} : { zhou: { parentSubmitted: true } };
    const mode = new URLSearchParams(location.search).get("mode");
    const isPreview = mode ? mode === "feishu" : !pilot;
    // shortcut: read-only embed spike using the existing public form, use per-task links when issuing real invitations.
    const feishuForm = "https://ccntnl19k0y3.feishu.cn/share/base/form/shrcncMIqMOGeIZbmhNIwnThbSc";
    const icons = {
      check: '<path d="m4 8 2.5 2.5L12 5"/>',
      clock: '<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1"/>',
      pending: '<circle cx="8" cy="8" r="5" stroke-dasharray="2 2"/>',
    };
    const icon = (name) => '<svg aria-hidden="true" viewBox="0 0 16 16">' + icons[name] + '</svg>';
    const view = document.querySelector("#view");
    const panel = document.querySelector("#teacher-panel");
    const notice = document.querySelector("#notice");
    const progressText = document.querySelector("#progress-text");
    const tabs = document.querySelector("#teachers");
    const courseMonth = pilot?.courseMonth ?? "2026-10";
    document.querySelector("#course-month").textContent = Number(courseMonth.slice(5)) + " 月课程";
    document.querySelector(isPreview ? "#live-mode" : "#local-mode").setAttribute("aria-current", "page");
    const escapeHtml = (value) => value.replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);

    function read() {
      try { return JSON.parse(localStorage.getItem(storageKey)) || sample; }
      catch { return sample; }
    }

    let state = isPreview ? sample : read();
    const isDone = (teacher) => teacher.submitted === true || state[teacher.id]?.submitted === true;
    const resume = () => teachers.filter((teacher) => state[teacher.id]?.draft && !isDone(teacher))
      .sort((a, b) => state[b.id].savedAt - state[a.id].savedAt)[0];
    let active = resume() || teachers.find((teacher) => !isDone(teacher));

    function say(message, error = false) {
      notice.textContent = message;
      notice.classList.toggle("error", error);
    }

    function updateTabs() {
      const done = teachers.filter(isDone).length;
      progressText.textContent = "已提交 " + done + " / " + teachers.length + " 份";
      const selected = active ?? teachers[0];
      panel.setAttribute("aria-labelledby", "tab-" + selected.id);
      tabs.innerHTML = teachers.map((teacher) => {
        const status = isDone(teacher) ? "done" : state[teacher.id]?.draft ? "draft" : "pending";
        return '<button class="tab" type="button" role="tab" id="tab-' + teacher.id + '" aria-controls="teacher-panel" aria-selected="' +
          (teacher === selected) + '" tabindex="' + (teacher === selected ? 0 : -1) + '"><strong>' + escapeHtml(teacher.name) + '</strong>' +
          '<span class="state" data-state="' + status + '">' + icon(status === "done" ? "check" : status === "draft" ? "clock" : "pending") +
          (status === "done" ? "已提交" : status === "draft" ? "有草稿" : "待评价") + '</span></button>';
      }).join("");
      const selectedTab = tabs.querySelector('[aria-selected="true"]');
      if (selectedTab.offsetLeft < tabs.scrollLeft + tabs.offsetLeft) tabs.scrollLeft = selectedTab.offsetLeft - tabs.offsetLeft - 4;
      else if (selectedTab.offsetLeft + selectedTab.offsetWidth > tabs.scrollLeft + tabs.offsetLeft + tabs.clientWidth) {
        tabs.scrollLeft = selectedTab.offsetLeft + selectedTab.offsetWidth - tabs.offsetLeft - tabs.clientWidth + 4;
      }
    }

    function selectTeacher(index) {
      if (active === teachers[index]) return;
      const form = view.querySelector("form");
      if (form && !form.saveDraft()) return;
      active = teachers[index];
      say("");
      render();
      tabs.children[index].focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }

    tabs.onclick = (event) => {
      const button = event.target.closest("[role=tab]");
      if (button) selectTeacher(teachers.findIndex((teacher) => button.id === "tab-" + teacher.id));
    };
    tabs.onkeydown = (event) => {
      const current = Math.max(0, teachers.indexOf(active));
      const keys = { ArrowLeft: current - 1, ArrowRight: current + 1, Home: 0, End: teachers.length - 1 };
      if (!(event.key in keys)) return;
      event.preventDefault();
      selectTeacher((keys[event.key] + teachers.length) % teachers.length);
    };

    function render(moveFocus = false) {
      const done = teachers.filter(isDone).length;
      updateTabs();
      const name = active ? escapeHtml(active.name) : "";
      const courses = active ? escapeHtml(active.courses) : "";
      const note = pilot ? '<p class="pilot-note">' + escapeHtml(pilot.student) + ' · 体验模式，试填仅保存在此手机</p>' : "";

      if (isPreview) {
        const teacher = active ?? teachers[0];
        view.innerHTML = '<h1 tabindex="-1">评价' + escapeHtml(teacher.name) + '</h1><p class="context">' + escapeHtml(teacher.courses) + '</p>' +
          '<p class="pilot-note">飞书原问卷只读预览。<a href="?mode=demo">体验试填</a></p>';
        const embed = document.querySelector("#embed");
        const source = teacher.formUrl ?? feishuForm;
        if (embed.firstElementChild?.src !== source) {
          embed.hidden = false;
          const frame = document.createElement("iframe");
          frame.title = "课程反馈问卷（飞书只读预览）";
          frame.setAttribute("sandbox", "allow-scripts allow-same-origin");
          frame.referrerPolicy = "no-referrer";
          frame.inert = true;
          frame.src = source;
          embed.replaceChildren(frame);
        }
      } else if (active && !isDone(active)) {
        view.innerHTML =
          '<h1 tabindex="-1">评价' + name + '</h1><p class="context">' + courses + '</p>' + note +
          '<form><p id="form-error" class="notice error form-error" role="alert" tabindex="-1" hidden></p><div class="questions">' +
          questions.map((question, index) =>
            '<fieldset><legend>' + question + '</legend><div class="scale">' +
            [1, 2, 3, 4, 5].map((score) => '<label><input type="radio" name="q' + index + '" value="' + score + '" aria-label="' + score + ' 分"><span aria-hidden="true">' + score + '</span></label>').join("") +
            '</div><div class="scale-ends"><span>1 分 · 很不满意</span><span>5 分 · 很满意</span></div></fieldset>'
          ).join("") +
          '<label class="suggestion" for="suggestion">给老师的建议 <span>（选填）</span></label><textarea name="suggestion" id="suggestion" maxlength="500"></textarea></div>' +
          '<div class="actions"><button type="button" class="button" id="save">保存，稍后继续</button>' +
          '<button type="submit" class="button primary">' + (done + 1 === teachers.length ? "提交反馈" : "提交并继续") + '</button></div></form>' +
          '<p class="help">没上过这位老师的课？请联系教务核对名单。</p>';

        const form = view.querySelector("form");
        const draft = state[active.id]?.draft;
        if (draft) {
          draft.scores.forEach((value, index) => { form.elements.namedItem("q" + index).value = value; });
          form.elements.suggestion.value = draft.suggestion;
        }
        const answers = () => {
          const values = new FormData(form);
          return { scores: questions.map((_, index) => values.get("q" + index) ?? ""), suggestion: values.get("suggestion") };
        };
        const save = (showError = true) => {
          const values = answers();
          if (values.scores.some(Boolean) || values.suggestion.trim()) return persist({ draft: values, savedAt: Date.now() }, showError);
          if (state[active.id]?.draft) return persist({}, showError);
          return "saved";
        };
        form.saveDraft = save;
        form.oninput = () => save(false);
        view.querySelector("#save").onclick = () => {
          const result = save();
          if (!result) return;
          say(result === "done" ? "这份反馈已提交。" : "可以关闭页面。下次用同一链接回来继续。");
          render(true);
        };
        form.onsubmit = (event) => {
          event.preventDefault();
          const values = answers();
          if (values.scores.some((score) => !score)) {
            formError("请先为三项内容各选一个分数。");
            return;
          }
          const submittedTeacher = active;
          const result = persist({ submitted: true });
          if (!result) return;
          const current = teachers.indexOf(submittedTeacher);
          active = [...teachers.slice(current + 1), ...teachers.slice(0, current)].find((teacher) => !isDone(teacher));
          say(submittedTeacher.name + "的反馈已提交。");
          render(true);
        };
      } else if (!active) {
        view.innerHTML = '<h1 tabindex="-1">本月反馈已全部提交</h1><p class="context">已完成 ' + done + ' 份课程反馈。</p>' + note;
      } else {
        view.innerHTML = '<h1 tabindex="-1">' + name + '的反馈已提交</h1><p class="context">' + courses + '</p>' + note;
      }

      if (moveFocus) {
        view.querySelector("h1").focus({ preventScroll: true });
        window.scrollTo(0, 0);
      }
    }

    function formError(message) {
      const error = view.querySelector("#form-error");
      error.hidden = false;
      error.textContent = message;
      error.focus();
    }

    function persist(entry, showError = true) {
      const latest = read();
      if (latest[active.id]?.submitted) {
        state = latest;
        return "done";
      }
      const next = { ...latest, [active.id]: { ...sample[active.id], ...entry } };
      try { localStorage.setItem(storageKey, JSON.stringify(next)); }
      catch {
        if (showError) formError("浏览器暂时无法保存，当前答案仍在页面上。请保持页面打开后重试。");
        return null;
      }
      state = next;
      return "saved";
    }

    render();
  </script>
</body>
</html>
