<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11月课程反馈 · 小禾</title>
<style>
:root{
  color-scheme:light;
  --accent:#0e2848;--ink:#0e2848;--sub:#56677d;--faint:#8693a5;
  --line:rgba(14,40,72,.16);--opt:rgba(14,40,72,.04);--opt-h:rgba(14,40,72,.08);--opt-on:rgba(14,40,72,.1);
  --gold:#ba8d45;--warn:#c2620c;--warn-ink:#8a3b07;
  --ease:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,.75,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#fff;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
h1,h2,p{margin:0}
.wx{position:sticky;top:0;z-index:30;height:44px;display:flex;align-items:center;justify-content:center;background:#ededed;font-size:16px;font-weight:600;border-bottom:.5px solid #d6d6d6;color:#111}

/* 顶部：进度线 + 返回 */
.top{position:sticky;top:44px;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.prog{height:3px;background:rgba(14,40,72,.07)}
.prog i{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;height:48px;margin:0 auto;padding:0 16px 0 10px;font-size:14px;color:var(--sub)}
.hd span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 4px;border:0;background:none;color:var(--sub);cursor:pointer;flex:none}
.back svg{width:18px;height:18px}

/* 一屏一题 */
#stage{position:relative;max-width:760px;margin:0 auto;padding:0 24px}
.screen{min-height:calc(100dvh - 95px);display:flex;flex-direction:column;justify-content:center;padding:28px 0 104px}
.qn{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.qn svg{width:14px;height:14px}
h2{font-size:22px;line-height:1.45;font-weight:500;letter-spacing:.01em;text-wrap:pretty}
h1:focus,h2:focus{outline:none}
.req{margin-left:3px;color:var(--accent)}
.hint{margin-top:8px;font-size:14px;color:var(--sub)}

.opts{display:grid;gap:8px;margin-top:24px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:11px 14px 11px 11px;border:1px solid var(--line);border-radius:6px;background:var(--opt);text-align:left;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s,transform .15s var(--ease)}
@media (hover:hover){.opt:not(:disabled):hover{background:var(--opt-h)}}
.opt:active:not(:disabled){transform:scale(.988)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--opt-on);box-shadow:inset 0 0 0 .5px var(--accent)}
.opt:focus-visible,.ok:focus-visible,.cta:focus-visible,.trow:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.key{flex:none;display:grid;place-items:center;width:24px;height:24px;border:1px solid rgba(14,40,72,.32);border-radius:4px;background:#fff;font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s}
.opt[aria-pressed=true] .key{background:var(--accent);border-color:var(--accent);color:#fff}
.lab{flex:1;min-width:0;line-height:1.45}
.lab b{font-weight:600}
.o-d{display:block;margin-top:2px;font-size:14px;color:var(--sub)}
.tick{flex:none;width:20px;height:20px;opacity:0;transform:scale(.5);transition:opacity .2s,transform .3s var(--ease)}
.tick svg{display:block;width:20px;height:20px}
.opt[aria-pressed=true] .tick{opacity:1;transform:none}
.opt:disabled{cursor:default;background:#fff;border-style:dashed;color:var(--faint)}
.opt:disabled .key{opacity:.45}
.aside{flex:none;font-size:13px}
/* 选中后闪两下再进下一题 */
.blink{animation:blink .42s linear}
@keyframes blink{0%,50%,100%{background:var(--opt-on)}25%,75%{background:#fff}}

.line{display:block;width:100%;margin-top:28px;padding:6px 0 10px;border:0;border-bottom:1.5px solid rgba(14,40,72,.28);border-radius:0;background:none;color:var(--ink);font:inherit;font-size:20px;line-height:1.5;resize:none;outline:none;transition:border-color .25s}
.line:focus{border-color:var(--accent)}
.line[hidden]{display:none}
.line::placeholder{color:rgba(14,40,72,.32)}
.line.other{margin-top:14px;font-size:17px}
.count{margin-top:6px;text-align:right;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}

.act{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;margin-top:28px}
.ok,.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s var(--ease),opacity .2s}
.ok svg,.cta svg{width:17px;height:17px}
.ok:active,.cta:active:not(:disabled){transform:scale(.97)}
.cta{min-height:52px;padding:0 28px;font-size:17px}
.cta:disabled{cursor:default;opacity:.75}
.err{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--warn-ink)}
.err svg{flex:none;width:16px;height:16px}
.err[hidden]{display:none}
.miss .opts .opt:not([aria-pressed=true]):not(:disabled){border-color:rgba(194,98,12,.55)}
.shake{animation:shake .42s var(--ease)}
@keyframes shake{18%,54%{transform:translateX(-6px)}36%,72%{transform:translateX(5px)}}
.link{min-height:44px;padding:0 4px;border:0;background:none;color:var(--accent);font-size:16px;font-weight:500;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(14,40,72,.3);text-underline-offset:5px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 提交页、完成页 */
.end h2,.sent h2{font-size:26px;font-weight:600;line-height:1.35}
.sum{margin-top:10px;font-size:15px;color:var(--sub)}
.end .err{margin-top:16px}
.seal{width:68px;height:68px;margin-bottom:24px}
.seal svg{display:block;width:100%;height:100%;fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
.seal .ring{stroke-width:2;stroke-dasharray:189}
.seal .tk{stroke-width:3;stroke-dasharray:38}
.play .seal .ring{animation:draw .7s var(--ease) both;--len:189}
.play .seal .tk{animation:draw .4s .45s var(--ease) both;--len:38}
.play h2{animation:rise .6s .55s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.spark{position:fixed;z-index:60;width:2px;height:10px;margin:-5px 0 0 -1px;border-radius:1px;pointer-events:none;opacity:0;animation:spark .8s cubic-bezier(.12,.8,.3,1) forwards}
.spark.dot{width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(var(--a)) scaleY(.3)}60%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--a)) scaleY(1)}}

/* 首页：老师清单 */
.hub{justify-content:flex-start;padding-top:44px}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:14px;color:var(--sub)}
.eyebrow img{width:22px;height:22px}
.hub h1{display:flex;align-items:center;gap:10px;margin-bottom:28px;font-size:30px;line-height:1.3;font-weight:600;letter-spacing:.01em}
.hub h1 svg{width:28px;height:28px;flex:none}
.tlist{border-top:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:14px;width:100%;min-height:70px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;transition:background .2s}
button.trow{cursor:pointer}
@media (hover:hover){button.trow:hover{background:var(--opt)}}
.ti{width:22px;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.tname{flex:1;min-width:0;font-size:17px;font-weight:500}
.tname small{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--sub)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);white-space:nowrap}
.st svg{width:12px;height:12px;flex:none}
.st.part{color:#2f5a8c}
.st.full{color:var(--accent);font-weight:600}
.chev{width:16px;height:16px;color:var(--faint);flex:none}
.hub .cta{align-self:flex-start;margin-top:32px}
.foot{margin-top:20px;font-size:14px;color:var(--sub)}

/* 上一题 / 下一题 */
.nav{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;display:flex;border-radius:6px;overflow:hidden}
.nav button{display:grid;place-items:center;width:44px;height:40px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.nav button+button{border-left:1px solid rgba(255,255,255,.22)}
.nav button:disabled{background:#9aa5b4;cursor:default}
.nav svg{width:18px;height:18px}
.nav[hidden],.top[hidden]{display:none}
@media (min-width:601px){.framed .nav{bottom:76px}} /* 只在 compare.html 里：让开右下角的版本切换条 */

.toast{position:fixed;left:50%;top:104px;z-index:40;padding:8px 14px;border-radius:6px;background:var(--accent);color:#fff;font-size:14px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-6px)}
.toast.show{animation:toast 3.2s var(--ease) both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-6px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

/* 换题：旧题上移淡出，新题从下方升起，选项依次跟上 */
/* 新题等旧题基本退场后再进，两屏不叠字 */
.in-up{animation:inUp .55s .2s var(--ease) both}
.in-down{animation:inDown .55s .2s var(--ease) both}
.in-fade{animation:inFade .5s var(--ease) both}
.out-up{animation:outUp .26s var(--ease-in) both}
.out-down{animation:outDown .26s var(--ease-in) both}
.out-fade{animation:outFade .25s linear both}
.in-up .opt,.in-down .opt{animation:item .5s var(--ease) both;animation-delay:calc(var(--i) * 40ms + 290ms)}
.in-fade .trow{animation:item .5s var(--ease) both;animation-delay:calc(var(--i) * 40ms + 90ms)}
@keyframes inUp{from{opacity:0;transform:translateY(48px)}}
@keyframes inDown{from{opacity:0;transform:translateY(-48px)}}
@keyframes inFade{from{opacity:0;transform:translateY(10px)}}
@keyframes outUp{to{opacity:0;transform:translateY(-48px)}}
@keyframes outDown{to{opacity:0;transform:translateY(48px)}}
@keyframes outFade{to{opacity:0}}
@keyframes item{from{opacity:0;transform:translateY(14px)}}

@media (min-width:700px){
  .wx{display:none}
  .top{top:0}
  .screen{min-height:calc(100dvh - 51px);padding:48px 0 120px}
  h2{font-size:28px}
  .end h2,.sent h2{font-size:32px}
  .hub{padding-top:72px}
  .hub h1{font-size:40px}
  .opts{max-width:600px}
  .line{max-width:640px}
  .count{max-width:640px}
  .toast{top:64px}
}

/* 感谢礼：照线上 FeedbackThanksDialog + feedback-thanks.css 的样式 */
.thanks-dialog{color-scheme:light;margin:auto;width:min(calc(100% - 24px),420px);max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain;padding:0;border:1px solid #dededb;border-radius:20px;background:#fffefa;color:#192f4c;box-shadow:0 20px 70px rgba(0,0,0,.18);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.thanks-dialog[open]{animation:dlg .28s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(12px) scale(.98)}}
.thanks-dialog::backdrop{background:#17294469}
.thanks-dialog button{border:0;background:none;font:inherit;color:inherit;cursor:pointer}
.thanks-dialog button:disabled{cursor:default;opacity:.48}
.thanks-dialog h2,.thanks-dialog p,.thanks-dialog ol{margin:0;padding:0;list-style:none}
.thanks-dialog .thanks-body{padding:14px 18px 18px}
.thanks-dialog .thanks-top,.thanks-dialog .wordmark,.thanks-dialog .sponsor,.thanks-dialog .step{display:flex;align-items:center}
.thanks-dialog .thanks-top{justify-content:space-between;border-bottom:1px solid #e8e6df;padding-bottom:10px;margin-bottom:18px}
.thanks-dialog .wordmark{gap:7px;font-size:13px;letter-spacing:.08em;font-weight:600}
.thanks-dialog .wordmark img{width:24px;height:24px}
.thanks-dialog .tool{display:grid;place-items:center;width:44px;height:44px;margin:-5px -9px -5px 0;border-radius:8px;color:#536278}
.thanks-dialog svg{width:18px;height:18px;flex:none}
.thanks-dialog h2{font:600 21px/1.4 "Songti SC","Noto Serif CJK SC",STSong,serif;letter-spacing:.01em;text-wrap:balance}
.thanks-dialog h2.center{text-align:center}
.thanks-dialog .heading-note,.thanks-dialog .invite-copy{font-size:13.65px;color:#596371;line-height:1.65}
.thanks-dialog .heading-note{margin-top:5px}
.thanks-dialog .step{gap:8px;margin-bottom:8px;font-size:12.3px;color:#596779}
.thanks-dialog .step li{display:inline-flex;gap:8px;align-items:center}
.thanks-dialog .step [aria-current]{font-weight:700;color:#102e55}
.thanks-dialog .envelope{display:grid;place-items:center;height:146px;margin-bottom:18px;border-radius:10px;background:radial-gradient(ellipse at 50% 90%,#f3e9cf,#faf6ec 70%)}
.thanks-dialog .envelope img,.thanks-dialog .gift-art img{object-fit:contain;mix-blend-mode:multiply}
.thanks-dialog .envelope img{width:143px;height:146px}
.thanks-dialog .invite-copy{margin:8px auto 15px;text-align:center}
.thanks-dialog .sponsor{gap:12px;padding:12px 14px;border:1px solid #d5e2f2;border-radius:10px;background:#edf4fc;color:#193e6b}
.thanks-dialog .sponsor strong,.thanks-dialog .sponsor small{display:block}
.thanks-dialog .sponsor strong{font-size:15.9px;line-height:1.5}
.thanks-dialog .sponsor small{font-size:12.9px;line-height:1.55;margin-top:2px;color:#425b77}
.thanks-dialog .sponsor svg{width:22px;height:22px}
.thanks-dialog .thanks-actions{display:grid;gap:3px;margin-top:18px}
.thanks-dialog .thanks-actions.split{grid-template-columns:auto 1fr;gap:12px}
.thanks-dialog .thanks-actions button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid transparent;border-radius:10px;padding:8px 15px;font-size:14.4px;font-weight:600;color:#4d5a6b}
.thanks-dialog .thanks-actions .primary-t{background:#123969;color:#fff}
.thanks-dialog .gift-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.thanks-dialog .gift-card{display:block;padding:0;text-align:left}
.thanks-dialog .gift-surface{position:relative;display:flex;flex-direction:column;min-height:100%;padding:5px 5px 10px;border:1px solid #deded9;border-radius:12px;background:#fff;overflow:hidden}
.thanks-dialog .gift-card[aria-pressed=true] .gift-surface{border-color:#345c8c;box-shadow:inset 0 0 0 1px #345c8c}
.thanks-dialog .gift-surface strong,.thanks-dialog .gift-surface small{padding-inline:6px}
.thanks-dialog .gift-surface strong{font-size:14.4px;color:#233852;font-weight:650;line-height:1.4;margin-top:7px}
.thanks-dialog .gift-surface small{font-size:12px;color:#596371;margin-top:2px}
.thanks-dialog .price{position:absolute;top:9px;left:10px;font-size:12.3px;line-height:1.5;font-weight:600;color:#384759;font-variant-numeric:tabular-nums}
.thanks-dialog .mark{display:none;position:absolute;top:9px;right:9px;width:17px;height:17px;place-items:center;border-radius:50%;background:#25486e;color:#fff}
.thanks-dialog .mark svg{width:12px;height:12px}
.thanks-dialog .gift-card[aria-pressed=true] .mark{display:grid}
.thanks-dialog .gift-art{width:100%;height:100px;display:grid;place-items:end center;border-radius:8px;background:#eaf0f6}
.thanks-dialog .gift-art img{width:83px;height:83px}
.thanks-dialog .gift-art[data-gift=flowers]{background:#f2f3e9}
.thanks-dialog .gift-art[data-gift=cake]{background:#faf0e8}
.thanks-dialog .gift-art[data-gift=pennant]{background:#f1edf4}
.thanks-dialog .gift-summary{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#eef5ff;border-radius:8px;padding:8px 11px;margin:12px 0 10px;font-size:12px;color:#294e7f}
.thanks-dialog .gift-summary span{display:inline-flex;gap:4px;align-items:center}
.thanks-dialog .message-options{display:grid;gap:3px;border:0;margin:0;padding:0}
.thanks-dialog .message-option{display:flex;align-items:center;gap:9px;min-height:38px;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-size:14px;cursor:pointer}
.thanks-dialog .message-option:has(:checked){border-color:#dceafe;background:#eef5ff;font-weight:650}
.thanks-dialog .message-option input{accent-color:#123969;width:16px;height:16px;margin:0;flex:none}
.thanks-dialog textarea{display:block;width:100%;resize:vertical;min-height:58px;margin-top:7px;border:1px solid #d5deea;border-radius:8px;background:#fff;padding:8px 10px;font:inherit;font-size:16px}
.thanks-dialog .counter{text-align:right;font-size:11px;color:#4c617a;margin-top:2px}
/* 调场景（只在 Demo 里） */
.tune{position:fixed;left:8px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:70;font-size:13px}
.tune summary{cursor:pointer;list-style:none;padding:4px 9px;border:1px solid #d1d1d6;border-radius:8px;background:#fff;font-size:12px;font-weight:600;opacity:.92;color:#1c1c1e}
.tune summary::-webkit-details-marker{display:none}
.tune>div{position:absolute;left:0;bottom:calc(100% + 6px);width:250px;display:grid;gap:4px;padding:8px;background:#fff;border:1px solid #d1d1d6;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);color:#1c1c1e}
.tune button{padding:6px 8px;border:1px solid #d1d1d6;border-radius:6px;background:#fff;font-size:13px;text-align:left;cursor:pointer}
.tune label{display:flex;gap:6px;align-items:center;padding:3px 2px}
.tune select{font:inherit;font-size:13px}
@media (min-width:700px){.tune{bottom:16px;left:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<div class="wx">菁仕教育</div>
<div class="top" id="top" hidden>
  <div class="prog"><i id="prog"></i></div>
  <header class="hd"><button class="back" data-go="hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>全部老师</button><span id="hd-t"></span></header>
</div>
<main id="stage"></main>
<nav class="nav" id="nav" hidden>
  <button data-go="prev" aria-label="上一题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
  <button data-go="next" aria-label="下一题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</nav>
<div class="toast" id="toast" role="status"></div>
<dialog class="thanks-dialog" id="thanks" aria-labelledby="thanks-title"></dialog>

<details class="tune" id="lab">
  <summary>调场景</summary>
  <div>
    <button data-s="normal">① 本月 3 位老师（周老师家长已评）</button>
    <button data-s="parent">② 家长填写（9 题）</button>
    <button data-s="zhou">③ 周老师：家长已提交，学生来评</button>
    <button data-s="missing">④ 必填题未选就点「确定」</button>
    <button data-s="draft">⑤ 中途退出后重开（恢复草稿）</button>
    <button data-s="many">⑥ 本月 6 位老师</button>
    <button data-s="closed">⑦ 本月反馈已截止</button>
    <button data-s="all">⑧ 学生、家长都已评完</button>
    <label><input type="checkbox" id="fail">下一次提交失败（网络断开）</label>
    <label><input type="checkbox" id="slow">提交较慢（4 秒）</label>
    <label><input type="checkbox" id="nogift">本月没有启用感谢礼</label>

  save();
  const v = val(q);
  el.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", q.type === multi ? v.includes(x.dataset.o) : v === x.dataset.o));
  el.classList.remove("miss"); el.querySelector(".err").hidden = true;
  const other = el.querySelector("[data-other]");
  if (other) {
    other.hidden = !(q.type === multi ? v.includes("其他") : v === "其他");
    if (!other.hidden && o === "其他") other.focus();
  }
  // 单选：选中的那项闪两下，再进下一题
  if (q.type === single && o !== "其他") {
    const g = gen;
    lock = true;
    b.classList.add("blink");
    setTimeout(() => { if (g !== gen) return; lock = false; next(); }, reduced() ? 150 : 460);
  }
}
function toast(msg) {
  const el = $("toast");
  el.textContent = msg; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}

document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el || el.closest("dialog") || el.disabled) return;
  if (el.dataset.s) { $("lab").open = false; load(el.dataset.s); return; }
  if (lock || busy || el.closest("[inert]")) return;
  if (el.dataset.t) return open(el.dataset.t);
  const go = el.dataset.go;
  if (go === "hub") return hub();
  if (go === "next") return next();
  if (go === "prev") return prev();
  if (go === "submit") return submit();
  if (el.dataset.o !== undefined && !settling) pick(el);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.closest("dialog") || view !== "form") return;
  const q = cur();
  if (el.dataset.txt !== undefined) {
    draft.a[q.id] = el.value;
    el.style.height = "auto"; el.style.height = el.scrollHeight + "px";
    el.parentElement.querySelector(".count").textContent = `${el.value.length}/500`;
  } else if (el.dataset.other !== undefined) draft.a[q.id + "-其他"] = el.value;
  else return;
  save();
});
// 电脑上：字母键选项、回车确定
document.addEventListener("keydown", e => {
  if (view !== "form" || lock || settling || busy || $("thanks").open || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName;
  if (e.key === "Enter" && tag !== "TEXTAREA" && tag !== "BUTTON") { e.preventDefault(); cur() === END ? submit() : next(); return; }
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const i = KEYS.indexOf(e.key.toUpperCase());
  const b = i >= 0 && screen().querySelectorAll(".opt")[i];
  if (b && !b.disabled) pick(b);
});

async function submit() {
  if (busy) return;
  const t = teacher(), qs = questions(), gap = qs.findIndex(q => q.req && !answered(q));
  if (gap >= 0) { idx = gap + 1; save(); mount(-1); miss(); return; } // 必填没答：回到第一道没答的
  const g = gen;
  busy = true; failed = false; paint();
  await wait($("slow").checked ? 4000 : 1000);
  if (g !== gen) return;
  if ($("fail").checked) { $("fail").checked = false; busy = false; failed = true; paint(); return; }
  const identity = draft.identity;
  t[who(identity)] = true;
  store.del("d." + t.id); store.set("identity", identity); store.set("state", S);
  busy = false; view = "sent"; last = { t, identity, gift: false, settled: false };
  const el = mount(0);
  el.classList.add("play");
  if ($("fx").value === "burst" && !reduced()) setTimeout(() => g === gen && burst(el.querySelector(".seal")), 620);
  await wait(reduced() ? 300 : 1500);
  if (g !== gen) return;
  $("nogift").checked ? finish(t, identity, false) : thanks(t, identity);
}
// 对勾画完时，从圆圈向四周弹出一圈细纸屑，0.8 秒
function burst(el) {
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#0e2848", "#ba8d45", "#3d6aa3", "#d9b878"];
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + (Math.random() - .5) * .3, d = 50 + Math.random() * 26;
    const s = document.createElement("i");
    s.className = "spark" + (i % 3 === 2 ? " dot" : "");
    s.style.cssText = `left:${cx + Math.cos(a) * 36}px;top:${cy + Math.sin(a) * 36}px;background:${colors[i % 4]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--a:${a + Math.PI / 2}rad`;
    document.body.append(s);
    setTimeout(() => s.remove(), 900);
  }
}
function nextTeacher(identity, from) {
  const self = who(identity), i = S.teachers.findIndex(x => x.id === from);
  return [...S.teachers.slice(i + 1), ...S.teachers].find(x => !x[self] && !full(x))?.id ?? "";
}
function finish(t, identity, gift) {
  last = { t, identity, gift, settled: true };
  paint();
  const el = screen(); el.querySelector(".act")?.classList.add("in-fade");
}

// s 为空 = 真实刷新：保留草稿和已提交状态，有未交的草稿就直接回到那一题；带场景 = 重置后进入该场景
function load(scene) {
  gen++; lock = false; settling = false; busy = false;
  if (scene) store.clear();
  if ($("thanks").open) $("thanks").close();
  S = (!scene && store.get("state")) || fresh(scene === "many");
  if (scene === "closed") S.closed = true;
  if (scene === "all") S.teachers.forEach(t => { t.student = true; t.parent = true; });
  if (scene === "draft") store.set("d.chen", { identity: "学生本人", i: 3, a: { "【学生】学习提升效果": "帮助较大，有一定提升", "【学生】责任心与服务态度": "是的，始终如此，非常满意" } });
  if (scene === "parent") store.set("d.chen", { identity: "家长/监护人", i: 1, a: {} });
  if (scene === "missing") store.set("d.chen", { identity: "学生本人", i: 1, a: {} });
  store.set("state", S);
  $("stage").innerHTML = "";
  const resume = !S.closed && S.teachers.find(t => !full(t) && Object.keys(store.get("d." + t.id)?.a || {}).length);
  if (scene === "parent" || scene === "missing") open("chen");
  else if (scene === "zhou") open("zhou");
  else if ((!scene || scene === "draft") && resume) open(resume.id, true);
  else hub();
  if (scene === "missing") miss();
}

function thanks(t, identity) {
  const d = $("thanks");
  let step = "invite", gift = null, choice = "", custom = "", sending = false;
  const note = () => choice === CUSTOM ? custom.trim() : choice;
  const close = given => { d.close(); finish(t, identity, given); };
  const draw = () => {
    const top = `<header class="thanks-top"><span class="wordmark"><img src="../../public/logo-blue.svg" alt="">菁仕教育</span>
      <button type="button" class="tool" data-a="skip" aria-label="关闭并跳过感谢礼" ${sending ? "disabled" : ""}>${I.x}</button></header>`;
    const steps = step === "invite" ? "" : `<ol class="step"><li ${step === "gifts" ? 'aria-current="step"' : ""}>${step === "gifts" ? "选礼物" : "已选礼物"}</li>
      <li ${step === "message" ? 'aria-current="step"' : ""}><span aria-hidden="true">›</span>留感谢语</li></ol>`;
    let body;
    if (step === "invite") body = `<div class="envelope"><img src="../../public/thanks/envelope.webp" alt=""></div>
      <h2 id="thanks-title" class="center">给${t.name}一份小小的感谢</h2><p class="invite-copy">这位老师的评价已提交。</p>
      <p class="sponsor">${I.gift}<span><strong>礼物我们来准备，您不用花钱</strong><small>我们会把礼物和您的感谢一起送给老师。</small></span></p>
      <div class="thanks-actions"><button class="primary-t" data-a="go">${I.mail}传递感谢</button><button data-a="skip">暂时不用</button></div>`;
    else if (step === "gifts") body = `<h2 id="thanks-title">选一份心意送给${t.name}</h2><p class="heading-note">这些礼物由菁仕准备，您不用花钱。</p>
      <div class="gift-grid">${GIFTS.map(g => `<button class="gift-card" data-g="${g.id}" aria-pressed="${gift?.id === g.id}"><span class="gift-surface">
        <span class="gift-art" data-gift="${g.id}"><img src="../../public/thanks/${g.id}.webp" alt=""></span><span class="mark">${I.check}</span>
        <strong>${g.label}</strong><small>${g.description}</small><span class="price">价值 ¥${g.value}</span></span></button>`).join("")}</div>
      <div class="thanks-actions split"><button data-a="invite">上一步</button><button class="primary-t" data-a="message" ${gift ? "" : "disabled"}>选感谢语</button></div>`;
    else body = `<h2 id="thanks-title">想对${t.name}说些什么？</h2><div class="gift-summary"><span>${I.gift}已选礼物</span><strong>${gift.label}</strong></div>
      <fieldset class="message-options" ${sending ? "disabled" : ""}>${NOTES.map(n => `<label class="message-option"><input type="radio" name="msg" value="${n}" ${choice === n ? "checked" : ""}>${n}</label>`).join("")}</fieldset>
      <textarea data-custom aria-label="自己写一句感谢语" placeholder="写下您想对老师说的话…" maxlength="200" ${sending ? "disabled" : ""}>${esc(custom)}</textarea>
      <p class="counter">${custom.length}/200</p>
      <div class="thanks-actions split"><button data-a="gifts" ${sending ? "disabled" : ""}>上一步</button>
        <button class="primary-t" data-a="send" ${note() && !sending ? "" : "disabled"}>${I.send}${sending ? "正在送出…" : "确认送出"}</button></div>`;
    d.innerHTML = `<div class="thanks-body">${top}${steps}${body}</div>`;
    d.scrollTop = 0;
  };
  d.onclick = async e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (b.dataset.g) { gift = GIFTS.find(g => g.id === b.dataset.g); draw(); return; }
    const a = b.dataset.a;
    if (a === "skip") return close(false);
    if (a === "go") step = "gifts";
    if (["invite", "gifts", "message"].includes(a)) step = a;
    if (a === "send") { const g = gen; sending = true; draw(); await wait(700); if (g === gen) close(true); return; }
    draw();
  };
  d.onchange = e => { if (e.target.name === "msg") { choice = e.target.value; draw(); } };
  d.oninput = e => {
    if (!e.target.dataset.custom) return;
    custom = e.target.value; choice = CUSTOM;
    d.querySelector(`input[value="${CUSTOM}"]`).checked = true;
    d.querySelector(".counter").textContent = `${custom.length}/200`;
    d.querySelector('[data-a="send"]').disabled = !note();
  };
  d.oncancel = e => { e.preventDefault(); if (!sending) close(false); };
  draw(); d.showModal();
}


if (self !== top) document.documentElement.classList.add("framed");
load(new URLSearchParams(location.search).get("s") || "");
</script>
